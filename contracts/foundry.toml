[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    # solady 0.0.160: the exact version compiled into Automata's DCAP verifier, so PckChip parses the PCK certificate identically
    "solady/=lib/solady-0.0.160/src/",
    # Smooth CryptoLib (MIT, audited in 2024): Ed25519 verification of the Proof of Cloud alliance tokens
    "@solidity/=lib/smooth-crypto-lib/src/",
]

# The level tests read real vectors (TDX quotes, a Proof of Cloud token): read-only access to this folder
fs_permissions = [{ access = "read", path = "./test/vectors" }]

# Smooth CryptoLib (Ed25519) is compiled WITHOUT via_ir, as in its own repository (its assembly is too deep for via_ir);
# ProofOfCloudAuditor, which imports it, is compiled with this profile; everything else is unchanged.
additional_compiler_profiles = [{ name = "scl", via_ir = false, optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "lib/smooth-crypto-lib/**", via_ir = false }]

[fmt]
line_length = 120
