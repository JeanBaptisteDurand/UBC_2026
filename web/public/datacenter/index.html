<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 93,27 93,73 50,96 7,73 7,27' fill='%235b8cff'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ArcHive Datacenter</title>
<meta name="description" content="A live 3D server room: every rack is a real ArcHive enclave on Arc testnet. Take the tour, replay the network's real history, then explore its state.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800;900&family=Chivo+Mono:wght@400;500&display=swap">
<style>
:root {
  /* Layout: a full-screen 3D scene, with a glass HUD at the edges: brand and tour top left, tools top right, act and
     stepper top centre, ticker bottom left, status bottom centre, panels on the right, tour card bottom centre.
     One deliberate dark look (the --space colours). */
  --space: #0A0F1F;
  --space-2: #151C38;
  --glass: rgba(16, 21, 41, .84);
  --glass-strong: rgba(14, 18, 36, .94);
  --line: rgba(190, 200, 255, .14);
  --text: #EEF1FB;
  --muted: #A6AED0;
  --accent: #5B8CFF;
  --kit: #FFA034;
  --good: #34D399;
  --session: #5B8CFF;
  --warn: #FBBF24;
  --bad: #F87171;
  --retired: #7B8194;
  --font: "Chivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Chivo Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background-color: var(--space);
  background-image: radial-gradient(120% 90% at 58% 42%, var(--space-2) 0%, var(--space) 62%);
  color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#stars, #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#stars { z-index: 0; pointer-events: none; }
#stage { z-index: 1; touch-action: none; cursor: default; }
#stage.hot { cursor: pointer; }
.labels { position: fixed !important; inset: 0; pointer-events: none; z-index: 2; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass {
  background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: 0 14px 40px -18px rgba(0, 0, 0, .7);
}

/* top left: brand and tour */
.topleft {
  position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 9px 15px 9px 11px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { display: block; font-size: 17px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.brand span { display: block; font-size: 12px; color: var(--muted); line-height: 1.25; }
.btn-tour {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 8px 15px;
  background: linear-gradient(180deg, #FFB65A, #F38E1F); color: #1B1206; font-weight: 800; font-size: 14px;
  box-shadow: 0 8px 24px -10px rgba(255, 160, 52, .8);
}
.btn-tour svg { width: 16px; height: 16px; }

/* top right: tools */
.tools {
  position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 56vw;
}
.ibtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 42px; height: 42px; padding: 0 12px;
  border-radius: 13px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; font-weight: 700; font-size: 13.5px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); text-decoration: none;
}
.ibtn svg { width: 18px; height: 18px; flex: none; }
.ibtn:hover { border-color: rgba(190, 200, 255, .32); }
.ibtn.primary { background: var(--accent); border-color: transparent; color: #0A0F1F; }
.ibtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* top centre: act banner, replay clock, journey stepper */
.topcenter {
  position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; max-width: min(560px, 46vw);
}
.act { padding: 8px 16px 9px; text-align: center; opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; }
.act.on { opacity: 1; transform: none; }
.act small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--kit); }
.act b { display: block; font-size: 15.5px; font-weight: 800; }
.act span { display: block; font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; padding: 5px; pointer-events: auto; }
.stepper button {
  border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.stepper button.on { background: rgba(91, 140, 255, .22); color: var(--text); }
.stepper i { color: rgba(190, 200, 255, .35); font-style: normal; font-size: 12px; }

/* bottom left: ticker */
.ticker {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  width: min(380px, 40vw); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px;
}
.ticker h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
.ticker h3 em { font-style: normal; font-family: var(--mono); color: var(--kit); font-weight: 500; letter-spacing: 0; }
.tick { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; padding: 4px 4px; border-radius: 8px; font-size: 13px; line-height: 1.35; animation: tickin .35s ease; }
.tick button { all: unset; cursor: pointer; }
.tick button:hover b { text-decoration: underline; }
.tick i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
.tick b { font-weight: 500; }
.tick small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tick a { font-family: var(--mono); font-size: 11px; color: var(--muted); }
@keyframes tickin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* bottom centre: status pill */
.status {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 0; padding: 6px 8px; border-radius: 999px; max-width: calc(100vw - 32px);
  font-size: 13px; font-weight: 600; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
}
.status::-webkit-scrollbar { display: none; }
.status > span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.status > span:last-child { border-right: 0; }
.status svg { width: 15px; height: 15px; opacity: .8; }
.mode { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--kit); display: inline-block; }
.mode.live i { background: var(--good); box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }

/* right panel */
.panel {
  position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 170px); overflow: auto; padding: 18px 18px 16px;
  transform: translateX(16px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
.panel.on { transform: none; opacity: 1; pointer-events: auto; }
.panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.panel h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.panel .x { border: 0; background: rgba(190, 200, 255, .1); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; flex: none; }
.panel p { margin: 0 0 10px; color: var(--text); font-size: 14px; }
.panel .muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kv code { font-family: var(--mono); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.panel .fact { font-family: var(--mono); font-size: 12px; color: var(--kit); background: rgba(255, 160, 52, .09); border-radius: 10px; padding: 8px 10px; }
.legend-list { list-style: none; margin: 4px 0 12px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.legend-list li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 13.5px; }
.legend-list i { width: 14px; height: 14px; border-radius: 4px; transform: translateY(3px); }
.legend-list b { display: block; }
.legend-list span { color: var(--muted); font-size: 12.5px; }
.panel ul.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13.5px; }
.field label { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 11px; background: rgba(190, 200, 255, .08); flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #0A0F1F; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.field small { color: var(--muted); font-size: 12px; }
.panel .link { display: inline-flex; margin-top: 4px; font-weight: 700; font-size: 13.5px; color: var(--accent); text-decoration: none; }

.panel input.find { width: 100%; box-sizing: border-box; margin: 2px 0 8px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: rgba(190, 200, 255, .08); color: var(--text); font: inherit; font-size: 14px; }
.panel input.find::placeholder { color: var(--muted); }
.panel input.find:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel .small { font-size: 12.5px; }
.panel h3 { margin: 14px 0 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.panel .rows { display: flex; flex-direction: column; gap: 2px; }
.panel .row { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 9px; align-items: start; padding: 5px 2px; }
.panel .row > i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
.panel .row .what { display: block; padding: 0; border: 0; background: none; color: var(--text); text-align: left; font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.panel .row button.what { cursor: pointer; }
.panel .row button.what:hover, .panel .row button.what:focus-visible { color: var(--accent); }
.panel .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.panel .row small a { color: var(--muted); }
.panel .hist { margin: 4px 0 8px; }

/* tour card */
.tour {
  position: fixed; z-index: 8; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translate(-50%, 12px);
  width: min(500px, calc(100vw - 32px)); padding: 18px 20px 16px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  background: var(--glass-strong);
}
.tour.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.tour .ico { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 160, 52, .16); display: grid; place-items: center; margin-bottom: 10px; }
.tour .ico svg { width: 20px; height: 20px; color: var(--kit); }
.tour h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; }
.tour p { margin: 0; color: var(--text); font-size: 15px; line-height: 1.55; }
.tour footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(190, 200, 255, .25); }
.dots i.on { background: var(--kit); width: 18px; border-radius: 4px; }
.tour .actions { display: flex; gap: 8px; }
.tbtn { border: 0; border-radius: 11px; padding: 9px 15px; cursor: pointer; font-weight: 800; font-size: 14px; background: rgba(190, 200, 255, .1); }
.tbtn.next { background: linear-gradient(180deg, #FFB65A, #F38E1F); color: #1B1206; }
.dim { position: fixed; inset: 0; z-index: 3; background: rgba(6, 9, 20, .22); opacity: 0; pointer-events: none; transition: opacity .3s; }
.dim.on { opacity: 1; }

/* tooltip, toast, bubbles, 3D labels */
.tooltip {
  position: fixed; z-index: 9; pointer-events: none; padding: 9px 11px; border-radius: 12px; font-size: 12.5px; max-width: 250px;
  background: var(--glass-strong); border: 1px solid var(--line); opacity: 0; transition: opacity .15s;
}
.tooltip.on { opacity: 1; }
.tooltip b { display: block; font-size: 13px; }
.tooltip span { color: var(--muted); }
.toast {
  position: fixed; z-index: 9; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); left: 50%; transform: translate(-50%, 8px);
  padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  background: var(--glass-strong); border: 1px solid var(--line); max-width: calc(100vw - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.zlabel {
  font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: #F6F2EC; padding: 3px 8px; border-radius: 8px;
  background: rgba(10, 15, 31, .62); border: 1px solid rgba(255, 255, 255, .12); white-space: nowrap; transition: opacity .3s;
}
.zlabel.off { opacity: 0; }
.badge3d {
  font: 800 12px/1 var(--font); padding: 5px 8px; border-radius: 9px; white-space: nowrap; color: #0A0F1F;
  box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .6); animation: rise 2.6s ease forwards;
}
@keyframes rise { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
.bubble {
  font: 700 12px/1.25 var(--font); background: #FFFFFF; color: #14182B; padding: 6px 9px; border-radius: 11px; white-space: nowrap;
  box-shadow: 0 8px 18px -10px rgba(0, 0, 0, .7); opacity: 0; transform: translateY(5px); transition: opacity .25s, transform .25s; position: relative;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px; background: #FFF; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.bubble.on { opacity: 1; transform: none; }
.layerlabel { font: 800 12.5px/1.2 var(--font); color: #DDE6FF; padding: 4px 9px; border-radius: 9px; background: rgba(40, 70, 170, .55); border: 1px solid rgba(160, 190, 255, .4); white-space: nowrap; transition: opacity .3s; }

#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--space); transition: opacity .6s, visibility .6s; }
#loader.done { opacity: 0; visibility: hidden; }
#loader .box { width: min(320px, 80vw); }
#loader p { margin: 0 0 12px; font-weight: 800; font-size: 15px; }
#loader .track { height: 4px; border-radius: 4px; background: rgba(190, 200, 255, .15); overflow: hidden; }
#loader .fillbar { height: 100%; width: 0; background: var(--kit); transition: width .2s; }
#loader small { display: block; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1100px) {
  .topcenter { display: none; }
  .ticker { width: min(330px, 46vw); }
}
@media (max-width: 760px) {
  .brand span { display: none; }
  .brand { padding: 7px 12px 7px 9px; }
  .brand b { font-size: 15px; }
  .ibtn .txt { display: none; }
  .ibtn.primary .txt { display: inline; }
  .ibtn { min-width: 38px; height: 38px; padding: 0 9px; }
  .tools { max-width: 60vw; gap: 6px; }
  .status { font-size: 11.5px; border-radius: 16px; left: 12px; right: 12px; transform: none; max-width: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); white-space: normal; padding: 5px 6px; }
  .status > span { padding: 3px 8px; border-right: 0; min-width: 0; }
  .status .opt { display: none; }
  .ticker { left: 12px; right: 12px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); padding: 8px 10px 6px; }
  .toast { top: calc(env(safe-area-inset-top, 0px) + 118px); bottom: auto; transform: translate(-50%, -8px); }
  .ticker .tick:nth-of-type(n+3) { display: none; }
  .tour { bottom: calc(env(safe-area-inset-bottom, 0px) + 122px); padding: 15px 16px 14px; }
  body:has(#tour.on) .ticker { visibility: hidden; }
  .tour h2 { font-size: 18px; }
  .tour p { font-size: 14.5px; }
  .panel { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-height: 62vh; left: 12px; right: 12px; width: auto; }
  .zlabel { font-size: 10.5px; display: none; }
  body.tour-zone .zlabel:not(.off) { display: block; }
}
@media (max-width: 380px) {
  .ibtn { min-width: 35px; height: 35px; padding: 0 8px; border-radius: 12px; }
  .ibtn svg { width: 17px; height: 17px; }
  .tools { gap: 5px; }
}
@media (pointer: coarse) {
  .ibtn { min-width: 44px; height: 44px; }
  .tools { gap: 8px; }
  .btn-tour, .tbtn, .seg button, .stepper button { min-height: 44px; }
  .panel .x { width: 44px; height: 44px; }
  .panel .row { min-height: 44px; align-items: center; }
  .ticker h3 { font-size: 12px; }
  .tick small, .tick a { font-size: 12px; }
  .tick a { display: inline-block; padding: 4px 0; }
  .status { font-size: 12.5px; }
  .mode { font-size: 12px; }
  .panel input.find { font-size: 16px; }
}
@media (pointer: coarse) and (max-width: 380px) {
  .ibtn { min-width: 44px; height: 44px; padding: 0 9px; }
  .ibtn svg { width: 18px; height: 18px; }
  .tools { gap: 6px; }
}
@media (min-width: 761px) and (max-width: 1000px) and (min-height: 501px) {
  .status { flex-wrap: wrap; justify-content: center; white-space: normal; border-radius: 16px; row-gap: 2px; }
  .ticker { bottom: calc(env(safe-area-inset-bottom, 0px) + 156px); }
}
@media (max-height: 500px) {
  .topcenter { display: none; }
  .topleft { top: calc(env(safe-area-inset-top, 0px) + 8px); gap: 6px; }
  .brand span { display: none; }
  .brand { padding: 6px 11px 6px 8px; }
  .brand b { font-size: 15px; }
  .btn-tour { padding: 6px 13px; }
  .tools { top: calc(env(safe-area-inset-top, 0px) + 8px); max-width: 64vw; }
  .ibtn .txt { display: none; }
  .ibtn.primary .txt { display: inline; }
  .ticker { display: none; }
  .status { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; max-width: none;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; justify-content: flex-start; white-space: nowrap; overflow-x: auto;
    font-size: 12px; padding: 3px 6px; border-radius: 14px; }
  .status > span { padding: 3px 8px; border-right: 1px solid var(--line); flex: none; min-width: max-content; }
  .status > span:last-child { border-right: 0; }
  .status .opt { display: inline-flex; }
  .tour { left: auto; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 50px);
    transform: translateY(12px); width: min(420px, 54vw); max-height: calc(100dvh - 130px); overflow-y: auto; padding: 12px 14px 10px; }
  .tour.on { transform: none; }
  .tour .ico { display: none; }
  .tour h2 { font-size: 16px; margin-bottom: 4px; }
  .tour p { font-size: 14px; line-height: 1.45; }
  .tour footer { margin-top: 10px; }
  .panel { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); left: auto;
    right: max(12px, env(safe-area-inset-right, 0px)); width: min(380px, 50vw); max-height: none; }
  .toast { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); transform: translate(-50%, 8px); }
  .toast.on { transform: translate(-50%, 0); }
  .zlabel { display: none; }
  body.tour-zone .zlabel:not(.off) { display: block; }
}
/* Touch screens: each ticker line is a 44 px target, and its transaction link a 44 px square at the right of
   the line (the arrow opens the explorer; the hash stays in the rack's panel); zone labels at 12 px */
@media (pointer: coarse) {
  .tick { position: relative; padding-right: 50px; }
  .tick button { display: flex; align-items: center; min-height: 44px; }
  .tick small .sep, .panel .row small .sep { display: none; }
  .tick small a, .panel .row small a { position: absolute; top: 0; right: 0; bottom: 0; width: 44px; display: grid; place-items: center; padding: 0; font-size: 0; border-radius: 8px; text-decoration: none; }
  .tick small a::after, .panel .row small a::after { content: '\2197'; font-size: 17px; line-height: 1; color: var(--muted); }
  /* the panel's lists (a rack's history, Find): each line a 44 px target, its transaction link a 44 px square at the right */
  .panel .row:has(small a) { position: relative; padding-right: 50px; }
  .panel .row button.what { display: flex; align-items: center; min-height: 44px; }
  .panel .link { min-height: 44px; align-items: center; }
  .zlabel { font-size: 12px; }
}
/* up to 1100 px wide, the tour card and the ticker share the bottom of the screen: the ticker waits for the end of the tour */
@media (max-width: 1100px) {
  body:has(#tour.on) .ticker { visibility: hidden; }
}
/* tablets (portrait): the status wraps on two or three rows; the tour card sits above them, and the AI gateway's label
   moves under the lab's (they touched) */
@media (min-width: 761px) and (max-width: 1000px) and (min-height: 501px) {
  .tour { bottom: calc(env(safe-area-inset-bottom, 0px) + 132px); }
  .zlabel[data-zone="provider"] { margin-top: 22px; }
}
/* short screens (landscape phones): the live badge comes first, and the bounties (or, under 760 px, both optional
   counts) give their place, so the line fits instead of being cut at the right edge */
@media (max-height: 500px) {
  .status .mode { order: -1; }
  .status > span { border-right: 0; border-left: 1px solid var(--line); }
  .status > span.mode { border-left: 0; }
  .status > span:has(#st-bounties) { display: none; }
}
@media (max-height: 500px) and (max-width: 760px) {
  .status .opt { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .act, .panel, .tour, .tooltip, .toast, .bubble, .zlabel, .layerlabel, #loader, .dim { transition: none; }
  .tick, .badge3d { animation: none; }
}

<script type="application/json" id="base-copy">{"en":{"brand":{"name":"ArcHive","tagline":"watch sealed servers get checked and paid"},"buttons":{"tour":"Tour","legend":"Legend","about":"About the data","settings":"Settings","language":"Language","console":"Open the console","overview":"Overview","close":"Close","next":"Next","back":"Back","skip":"Skip","start":"Start exploring","follow":"Follow the action","replay":"Replay history","live":"Live","now":"Skip to now","find":"Find"},"tour":[{"title":"Welcome to the ArcHive server room","body":"This is how ArcHive works, told as a server room. Every cabinet is a slot where an enclave can run, and every event you will see happened on Arc testnet. We replay that history faster so you can watch it."},{"title":"At the counter, a client asks for a service","body":"An app or a person asks for a service: a private AI, a paid call, a bounty. It checks on Arc the key of the enclave that will serve it, then seals its request for that enclave alone. It pays per use, in USDC."},{"title":"The request goes to the back, where a technician starts an enclave","body":"The sealed request rides to the server hall. For a service to exist, an operator starts an enclave: the service's exact code goes into a cabinet, an Intel TDX machine, and the operator locks a USDC bond. Only an enclave started with the product's exact code is accepted."},{"title":"Inside a cabinet, even the owner is locked out","body":"Intel TDX encrypts the server's memory, so the operator who owns the machine cannot read what runs inside. Its keys are born there, and Arc checks a fingerprint of the exact code it runs."},{"title":"Three layers come down from Arc","body":"The silicon is half the story. Over the racks float three records kept on Arc: the registry of enclaves that passed the check, the product contract that fixes code, price and revenue split, and the bond that makes lying expensive."},{"title":"Arc checks every enclave","body":"Each enclave's chip signs a quote that says which code runs, on which processor, at which security level. A contract on Arc checks Intel's signature itself. Debug mode, missing security updates, unknown code or an old quote: the enclave serves no one. Checks repeat about every 12 hours."},{"title":"The robot notary runs it again","body":"Some work can be checked by running it again. A hunter's exploit is replayed in an enclave on a fork of Arc and paid only if the loss is real. A machine caught lying loses its bond, split between the reporter and the victim."},{"title":"Now explore","body":"Click any cabinet to see the real enclave behind it and its history on Arc. The magnifier finds any key or transaction. Replay the history, jump to the lying machine, or open the console to use the services yourself."}],"zones":{"pad":{"title":"Loading dock","body":"Operators ship their machines here. Each one is an Intel TDX server that the operator rents out to the network. Before it can earn anything, the operator locks a USDC bond that a proven lie would cost.","fact":"11 USDC posted as bonds since 14 Nov, 1 USDC seized (Arc testnet)","liveFact":"{bonded} USDC posted as bonds since 14 Nov, {slashed} USDC seized (live, Arc testnet)"},"gate":{"title":"The Arc gate","body":"New machines come in here. Arc reads the chip's identity (its PPID) inside Intel's signed certificate; for the verified level, the Proof of Cloud alliance must also have declared the machine's datacenter, and Arc checks that signature too. The enclaves started on the machine are then checked one by one at their cabinet.","fact":"1 machine at the verified level on the first stack (v2.1): chip 0x62d5…ce56, datacenter declared by Proof of Cloud on 15 Nov (Arc testnet)"},"dish":{"title":"Link to Arc","body":"Everything that matters is written on Arc: checks, payments, bonds and verdicts. Arc adds a block about every half second, and a payment is final in the block that holds it. The wall board counts Arc's blocks.","fact":"Arc testnet, chain 5042002"},"hive":{"title":"Server hall","body":"Each cabinet is a slot where an operator can start an enclave, a sealed machine with its own key. Green ones passed Arc's check and can serve. Grey ones are history: their code was retired or their check expired. The red one was caught lying. Dark cabinets are free.","fact":"15 machines registered on the first stack (v2.1) since 14 Nov, 5 live on 17 Nov","liveFact":"{enclaves} enclave keys registered on the {stack} stack, {active} live now"},"layers":{"title":"Three layers from Arc","body":"The enclave registry lists every server that passed the gate. The product contract fixes each service's code fingerprint, price and revenue split, and changes wait out a delay. The operator's bond makes a proven lie cost money.","fact":"Verdicts go to Circle's ERC-8004 registry on Arc: 3 written by 17 Nov","liveFact":"Verdicts go to Circle's ERC-8004 registry on Arc: {verdicts} written so far"},"dock":{"title":"Client counter","body":"Clients come here to use a service. The app checks the enclave's key on Arc, seals the request to it, and it travels to the rack. The signed answer comes back the same way. You pay per use in USDC, per call with x402 or from a prepaid session.","fact":"5 paid calls and 1 session, 0.1494 USDC settled on the first stack (v2.1) by 17 Nov (team wallets, testnet prices)","liveFact":"{calls} paid calls and {sessions} sessions, {settled} USDC settled so far (team wallets, testnet prices)"},"lab":{"title":"The robot notary's lab","body":"For a Sealed Bounty, a protocol funds a pool. A hunter's exploit is replayed inside an enclave on a fork of Arc, and the hunter is paid in the same flow if the loss is real. Other operators can replay a claim to refute it within 3 days.","fact":"1 bounty paid 0.5 USDC on 14 Nov, 1 lying claim refuted on 15 Nov","liveFact":"{bountiesPaid} bounty paid ({bountyPaid} USDC), {refuted} lying claim refuted; {open} bounty open now, of {bounties}"},"noc":{"title":"The technician's desk","body":"An operator's technician works here. When a service needs an enclave, the order arrives through the tube; the technician takes that service's module from the shelf, slides it into a free cabinet and starts it. Arc then checks the enclave before it may serve.","fact":"15 enclaves started on the first stack (v2.1) since 14 Nov; 40 checks on Arc, renewals included (Arc testnet)","liveFact":"{enclaves} enclave keys registered on the {stack} stack, {active} live now (Arc testnet)"}},"legend":{"title":"Reading the server room","intro":"The light bar on top of each cabinet shows its state. The colour of the module inside, and of the strip at its foot, shows which service it runs.","states":[{"key":"live","label":"Live","hint":"Passed the gate on Arc and can serve."},{"key":"session","label":"In a session","hint":"A client prepaid it, and it serves that client."},{"key":"checking","label":"Being checked","hint":"Its quote is going through the Arc gate."},{"key":"fault","label":"Caught lying","hint":"Its claim was refuted and its bond seized."},{"key":"retired","label":"Retired","hint":"Its code was retired or its check expired."},{"key":"empty","label":"Free cabinet","hint":"A dark cabinet: room for a new enclave."}],"notes":["In the tube, orange tickets are orders to start an enclave; blue envelopes are sealed requests, green ones signed answers.","Blue coins are USDC moving on Arc.","A light running to the wall board means a record was written on Arc.","The three layers over the racks glow when the registry, a product or a bond changes.","A gold seal on top of a cabinet: the verified level (chip and datacenter declared on Arc)."]},"status":{"block":"Arc block {n}","pods":"{live} racks live of {total}","paid":"{usdc} USDC settled","calls":"{n} paid calls","bounties":"{n} bounties, {usdc} USDC pool","live":"live","replay":"replaying {date}","stale":"first stack (v2.1) · data from {time}","liveStack":"live · {name} stack"},"stepper":["Sealed","Checked on Arc","Served","Paid"],"pod":{"title":"Rack {short}","service":"Service","operator":"Operator","level":"Level","levels":{"verified":"Verified (chip and datacenter on Arc)","open":"Open"},"status":"Status","statuses":{"live":"Live","session":"In a session","checking":"Being checked","fault":"Caught lying","retired":"Retired","expired":"Check expired","empty":"Empty slot","firstStack":"First stack (v2.1)"},"checked":"Last checked on Arc","valid":"Check valid until","renewals":"Checks on Arc","fingerprint":"Code fingerprint","machine":"Machine chip","explorer":"See it on the Arc explorer","sealed":"Nobody can look inside this machine, its owner included. Intel TDX encrypts its memory, and only its own key opens what clients send it.","liar":"On 15 Nov this demo machine signed a false claim. Two other operators replayed it, the claim was refuted and its bond seized.","history":"History on Arc","historyCount":"{n} transactions","historyCount1":"1 transaction","stack":"Stack"},"products":{"1":{"name":"Private AI inference","short":"AI sessions","how":"Prepaid session in USDC, billed per unit of text (0.0001 USDC on testnet)."},"2":{"name":"Sealed Bounty","short":"Bounty","how":"Paid from the protocol's bounty pool when a replayed exploit proves a real loss."},"3":{"name":"Pay-per-call AI (x402)","short":"x402 calls","how":"One signature pays one call, 0.01 USDC on testnet, settled on Arc."},"4":{"name":"Attested copilot","short":"Copilot","how":"The site's free copilot, running in its own enclave: it answers in the copilot panel of the site's pages."},"5":{"name":"Refutation demo bounty","short":"Demo bounty","how":"First stack only: a test bounty used on 15 Nov to show how a lying machine is caught."},"6":{"name":"Verified Sealed Bounty (retired)","short":"Retired bounty","how":"First stack only: replaced by product 7 on 16 Nov after a security fix."},"7":{"name":"Sealed Bounty, verified level","short":"Verified bounty","how":"Only machines on a chip and datacenter verified on Arc may serve it (product 7 on the first stack, product 5 on v3)."}},"events":{"register":"Enclave {pod} started for {product}, checked by Arc","renew":"Machine {pod} was checked again on Arc","image":"Code fingerprint of machine {pod} recorded","machine_bound":"Machine {pod} tied to its chip on Arc","poc_token":"Proof of Cloud declared the machine's datacenter on Arc","invalidated":"Machine {pod} retired, its code is no longer allowed","retired":"Machine {pod} retired by its operator","expired":"Machine {pod}'s check expired","product_proposed":"New product proposed: {product}","product_activated":"Product live: {product}","product_update":"Product updated after its delay: {product}","manifest_update":"Description link changed: {product}","image_proposed":"New code proposed for {product}","image_allowed":"New code allowed for {product}","image_retired":"Old code retired for {product}","bond_posted":"An operator locked {amount} USDC as bond","bond_reserved":"Bond reserved for machine {pod}","bond_released":"Bond released from machine {pod}","unbond":"A demo operator asked to withdraw its bond","slashed":"{amount} USDC of bond seized","exposure":"Paid work counted against the operator's daily cap","session_opened":"A client prepaid a {amount} USDC session","settled":"Operator paid {amount} USDC from the session","session_closed":"Session closed, {amount} USDC refunded","call_settled":"Paid call settled, {amount} USDC to the operator","verdict_ok":"Verdict {verdict}/100 written to ERC-8004","verdict_bad":"Verdict {verdict}/100 written, the claim was false","bounty_created":"A protocol funded a {amount} USDC bounty","claim_accepted":"Claim accepted after a replay on a fork of Arc","exploit_delivered":"Sealed report delivered to the protocol","bounty_paid":"Hunter paid {amount} USDC for a real exploit","claim_refuted":"Two replays refuted machine {pod}'s claim","admin":"Contracts on Arc wired together","policy":"A product now requires the verified level"},"acts":[{"title":"v2.1 · Network opens","story":"14 Nov, the first stack (v2.1). The contracts are wired, the operator locks an 8 USDC bond and four products go live."},{"title":"v2.1 · First paid work","story":"Machines pass the gate, paid calls settle, a session runs and a hunter is paid 0.5 USDC for a real exploit."},{"title":"v2.1 · A lying machine is caught","story":"15 Nov. A demo machine files a false claim. Two honest replays refute it and its 1 USDC bond is seized."},{"title":"v2.1 · The verified level","story":"New code for three products, machines checked again, and the machine's datacenter declared on Arc by Proof of Cloud."},{"title":"v2.1 · Product 7","story":"16 Nov. A Sealed Bounty that only verified machines may serve, with a 1 USDC pool."},{"title":"v2.1 · Steady state","story":"Since then, each live machine is checked again on Arc about every 12 hours."}],"about":{"title":"About the data","paras":["The recorded history is ArcHive's first stack, v2.1 (deployments.v21.testnet.json), read from its public API and the Arc explorer on 17 Nov 2026 at 23:40 UTC. Live, the room follows the v3 stack (deployments.v3.testnet.json, deployed on 19 Nov 2026).","The replay plays the first stack's 261 events, recorded on Arc between 14 and 17 Nov, in order and faster than real time, then the events the live API reports since. Idle hours are skipped. The ticker links each event to its transaction.","The page reads the live API (the v3 stack) and shows the network as it is now: the v3 racks light up, the first stack's stay as history. When the API cannot be reached, it shows the first stack's state of 17 Nov.","This is a testnet built by the ArcHive team. All operators so far, including the three demo identities of the refutation demo, are the team's, and so are the paying wallets. Prices are set high so every payment shows on the explorer.","Colours show what the chain records: passed checks, sessions, refuted claims. They say nothing more about whether a machine is up.","The clients, the technicians and the tube are a staging; every event in the ticker is a real transaction on Arc. 3D models: Kenney's Factory Kit, Space Station Kit, Furniture Kit, Mini Shop and Mini Characters (CC0); server racks: “Data center rack” by Animase (NodeStar) on Sketchfab, Free Standard licence."],"events":"{n} events","liveReplay":"The replay plays, in order, the events recorded on Arc since 14 Nov: the first stack's (v2.1), then from 19 Nov those of v3, which ran alongside it until the switch ({n} so far), faster than real time. Quiet hours are skipped. The ticker links each event to its transaction.","live":"Here the page reads ArcHive's API every 20 seconds, on the live stack (v3): a new key gets its rack, and each new event plays as it happens, stamped with the time of its block on Arc. The first stack's racks stay as history."},"settings":{"title":"Settings","language":"Language","pace":"Replay speed","mode":"Show","modeLive":"Live network","modeReplay":"Replay the history","modeHint":"Live mode reads the ArcHive API every 20 seconds.","motion":"Motion","motionHint":"","follow":"Camera follows the action","on":"On","off":"Off","jump":"Jump to a moment of the history"},"toasts":{"replayStart":"Replaying the network's real history, faster","replayEnd":"Replay finished. This is the latest known state.","liveOn":"Live data on","liveOff":"Live data off","follow":"The camera follows the action","followDone":"","noLive":"Live data cannot be reached right now. Showing the state of 17 Nov.","liveNew":"New on Arc: {n} events","liveNew1":"New on Arc: 1 event","skipNow":"This is the network now, live. Replay its history with the replay button."},"errors":{"models":"The server room could not load its 3D models.","live":"Reload the page to try again.","noWebgl":"This device can't show the 3D room: WebGL is off or unavailable.","noWebglLink":"See the same enclaves in the console's hive"},"ticker":{"title":"On Arc","empty":"Events appear here as they happen."},"speech":{"ask":"{service}, please!","thanks":"Thanks!","start":"Starting an enclave: {service}","publish":"Product update on Arc"},"find":{"title":"Find a rack or a transaction","placeholder":"Key, operator, service or transaction hash","hint":"The archive keeps every transaction the room has seen since 14 Nov, on both stacks ({n} so far; one transaction can hold several events).","racks":"Racks","live":"Racks in service","txs":"Transactions","recent":"Latest transactions","none":"Nothing matches. Paste all or part of a key, an address or a transaction hash."},"stacks":{"first":"{name}, the first stack (from 14 Nov)","live":"{name}, the live stack (from 19 Nov)","liveAct":{"title":"The {name} stack","story":"19 Nov. The same contracts, deployed again as {name}. The two stacks run side by side until the switch; then {name} serves alone, and the {first} history stays as it happened."}}},"fr":{"brand":{"name":"ArcHive","tagline":"des serveurs scellés, vérifiés et payés"},"buttons":{"tour":"Visite","legend":"Légende","about":"D'où viennent les données","settings":"Réglages","language":"Langue","console":"Ouvrir la console","overview":"Vue d'ensemble","close":"Fermer","next":"Suivant","back":"Retour","skip":"Passer","start":"Explorer","follow":"Suivre l'action","replay":"Rejouer l'histoire","live":"En direct","now":"Revenir à maintenant","find":"Chercher"},"tour":[{"title":"Bienvenue dans la salle des serveurs d'ArcHive","body":"Voici comment fonctionne ArcHive, raconté comme une salle des serveurs. Chaque baie est un casier où peut tourner une enclave, et chaque événement que vous verrez a eu lieu sur Arc testnet. Nous rejouons cette histoire en accéléré."},{"title":"Au guichet, un client demande un service","body":"Une application ou une personne demande un service : une IA privée, un appel payé, une prime. Elle vérifie sur Arc la clé de l'enclave qui va la servir, puis scelle sa demande pour cette enclave seule. Elle paie à l'usage, en USDC."},{"title":"La demande part à l'arrière, un technicien démarre une enclave","body":"La demande scellée voyage jusqu'à la salle des serveurs. Pour qu'un service existe, un opérateur démarre une enclave : le code exact du service entre dans une baie, une machine Intel TDX, et l'opérateur bloque une caution en USDC. Seule une enclave démarrée avec le code exact du produit est acceptée."},{"title":"Dans une baie, même le propriétaire reste à la porte","body":"Intel TDX chiffre la mémoire du serveur, si bien que l'opérateur qui possède la machine ne peut pas lire ce qui tourne dedans. Ses clés naissent à l'intérieur, et Arc vérifie l'empreinte exacte de son code."},{"title":"Trois couches descendent d'Arc","body":"Le matériel ne fait que la moitié du travail. Au-dessus des baies flottent trois registres tenus sur Arc : la liste des enclaves admises, le contrat du produit qui fixe code, prix et partage des revenus, et la caution qui rend le mensonge coûteux."},{"title":"Arc vérifie chaque enclave","body":"La puce de chaque enclave signe une attestation : quel code tourne, sur quel processeur, à quel niveau de sécurité. Un contrat sur Arc vérifie lui-même la signature d'Intel. Mode debug, mises à jour manquantes, code inconnu ou attestation trop vieille : l'enclave ne sert personne. Les vérifications se répètent environ toutes les 12 heures."},{"title":"Le notaire-robot refait le calcul","body":"Certains travaux se vérifient en les refaisant. L'exploit d'un chasseur est rejoué dans une enclave, sur une copie d'Arc, et payé seulement si la perte est réelle. Une machine prise à mentir perd sa caution, partagée entre celui qui la dénonce et la victime."},{"title":"À vous d'explorer","body":"Cliquez sur une baie pour voir la vraie enclave qui s'y trouve et son historique sur Arc. La loupe retrouve n'importe quelle clé ou transaction. Rejouez l'histoire, allez voir la machine menteuse, ou ouvrez la console pour utiliser les services."}],"zones":{"pad":{"title":"Quai de livraison","body":"Les opérateurs livrent ici leurs machines. Chacune est un serveur Intel TDX que l'opérateur loue au réseau. Avant de gagner quoi que ce soit, l'opérateur bloque une caution en USDC, qu'un mensonge prouvé lui ferait perdre.","fact":"11 USDC de cautions déposées depuis le 14 nov., 1 USDC saisi (Arc testnet)","liveFact":"{bonded} USDC de cautions déposées depuis le 14 nov., {slashed} USDC saisis (en direct, Arc testnet)"},"gate":{"title":"Le portique d'Arc","body":"Les machines neuves entrent ici. Arc lit l'identité de leur puce (son PPID) dans le certificat signé d'Intel ; pour le niveau vérifié, l'alliance Proof of Cloud doit aussi avoir déclaré le datacenter de la machine, et Arc vérifie cette signature. Les enclaves démarrées sur la machine sont ensuite vérifiées une par une à leur baie.","fact":"1 machine au niveau vérifié sur la première pile (v2.1) : puce 0x62d5…ce56, datacenter déclaré par Proof of Cloud le 15 nov. (Arc testnet)"},"dish":{"title":"Le lien avec Arc","body":"Tout ce qui compte est écrit sur Arc : vérifications, paiements, cautions et verdicts. Arc ajoute un bloc environ toutes les demi-secondes, et un paiement est définitif dans le bloc qui le contient. Le panneau mural compte les blocs d'Arc.","fact":"Arc testnet, chaîne 5042002"},"hive":{"title":"La salle des baies","body":"Chaque baie est un casier où un opérateur peut démarrer une enclave, une machine scellée avec sa propre clé. Les vertes ont passé la vérification d'Arc et peuvent servir. Les grises appartiennent à l'histoire : leur code a été retiré ou leur vérification a expiré. La rouge a été prise à mentir. Les baies éteintes sont libres.","fact":"15 machines inscrites sur la première pile (v2.1) depuis le 14 nov., 5 en service le 17 nov.","liveFact":"{enclaves} clés d'enclave inscrites sur la pile {stack}, {active} en service maintenant"},"layers":{"title":"Trois couches venues d'Arc","body":"Le registre des enclaves liste chaque serveur admis. Le contrat du produit fixe l'empreinte du code, le prix et le partage des revenus de chaque service, et tout changement attend un délai. La caution de l'opérateur fait payer un mensonge prouvé.","fact":"Les verdicts vont au registre ERC-8004 de Circle sur Arc : 3 écrits au 17 nov.","liveFact":"Les verdicts vont au registre ERC-8004 de Circle sur Arc : {verdicts} écrits à ce jour"},"dock":{"title":"Le guichet des clients","body":"Les clients viennent ici utiliser un service. L'application vérifie la clé de l'enclave sur Arc, scelle la requête pour elle, et la requête part vers la baie. La réponse signée revient par le même chemin. Vous payez à l'usage en USDC, à l'appel avec x402 ou depuis une session prépayée.","fact":"5 appels payés et 1 session, 0,1494 USDC réglés sur la première pile (v2.1) au 17 nov. (portefeuilles de l'équipe, prix de testnet)","liveFact":"{calls} appels payés et {sessions} sessions, {settled} USDC réglés à ce jour (portefeuilles de l'équipe, prix de testnet)"},"lab":{"title":"Le labo du notaire-robot","body":"Pour une Prime scellée, un protocole finance une cagnotte. L'exploit d'un chasseur est rejoué dans une enclave, sur une copie d'Arc, et le chasseur est payé dans la foulée si la perte est réelle. D'autres opérateurs peuvent rejouer une réclamation pour la réfuter pendant 3 jours.","fact":"1 prime payée 0,5 USDC le 14 nov., 1 réclamation mensongère réfutée le 15 nov.","liveFact":"{bountiesPaid} prime payée ({bountyPaid} USDC), {refuted} réclamation mensongère réfutée ; {open} prime ouverte maintenant, sur {bounties}"},"noc":{"title":"Le poste du technicien","body":"Le technicien d'un opérateur travaille ici. Quand un service a besoin d'une enclave, l'ordre arrive par le tube ; le technicien prend le module de ce service sur l'étagère, le glisse dans une baie libre et la démarre. Arc vérifie ensuite l'enclave avant qu'elle puisse servir.","fact":"15 enclaves démarrées sur la première pile (v2.1) depuis le 14 nov. ; 40 vérifications sur Arc, renouvellements compris (Arc testnet)","liveFact":"{enclaves} clés d'enclave inscrites sur la pile {stack}, {active} en service maintenant (Arc testnet)"}},"legend":{"title":"Lire la salle des serveurs","intro":"La barre lumineuse en haut de chaque baie montre son état. La couleur du module inséré, et de la bande à son pied, indique le service qu'elle fait tourner.","states":[{"key":"live","label":"En service","hint":"A passé le portique d'Arc et peut servir."},{"key":"session","label":"En session","hint":"Un client l'a prépayée, et elle sert ce client."},{"key":"checking","label":"En vérification","hint":"Son attestation passe le portique d'Arc."},{"key":"fault","label":"Prise à mentir","hint":"Sa réclamation a été réfutée et sa caution saisie."},{"key":"retired","label":"Retirée","hint":"Son code a été retiré ou sa vérification a expiré."},{"key":"empty","label":"Baie libre","hint":"Une baie éteinte : de la place pour une nouvelle enclave."}],"notes":["Dans le tube, les tickets orange sont des ordres de démarrage ; les enveloppes bleues sont des requêtes scellées, les vertes des réponses signées.","Les pièces bleues sont des USDC qui circulent sur Arc.","Une lumière qui file vers le panneau mural signale un enregistrement sur Arc.","Les trois couches au-dessus des baies s'allument quand le registre, un produit ou une caution change.","Un sceau doré sur une baie : le niveau vérifié (puce et datacenter déclarés sur Arc)."]},"status":{"block":"Bloc Arc {n}","pods":"{live} baies en service sur {total}","paid":"{usdc} USDC réglés","calls":"{n} appels payés","bounties":"{n} primes, cagnotte de {usdc} USDC","live":"en direct","replay":"rejeu du {date}","stale":"première pile (v2.1) · données du {time}","liveStack":"en direct · pile {name}"},"stepper":["Scellée","Vérifiée sur Arc","Servie","Payée"],"pod":{"title":"Baie {short}","service":"Service","operator":"Opérateur","level":"Niveau","levels":{"verified":"Vérifié (puce et datacenter sur Arc)","open":"Ouvert"},"status":"État","statuses":{"live":"En service","session":"En session","checking":"En vérification","fault":"Prise à mentir","retired":"Retirée","expired":"Vérification expirée","empty":"Emplacement vide","firstStack":"Première pile (v2.1)"},"checked":"Dernière vérification sur Arc","valid":"Vérification valable jusqu'au","renewals":"Vérifications sur Arc","fingerprint":"Empreinte du code","machine":"Puce de la machine","explorer":"Voir sur l'explorateur d'Arc","sealed":"Personne ne peut regarder dans cette machine, pas même son propriétaire. Intel TDX chiffre sa mémoire, et seule sa clé ouvre ce que les clients lui envoient.","liar":"Le 15 nov., cette machine de démonstration a signé une fausse réclamation. Deux autres opérateurs l'ont rejouée, elle a été réfutée et sa caution saisie.","history":"Historique sur Arc","historyCount":"{n} transactions","historyCount1":"1 transaction","stack":"Pile"},"products":{"1":{"name":"Inférence d'IA privée","short":"Sessions IA","how":"Session prépayée en USDC, facturée à l'unité de texte (0,0001 USDC en testnet)."},"2":{"name":"Prime scellée","short":"Prime","how":"Payée par la cagnotte du protocole quand un exploit rejoué prouve une vraie perte."},"3":{"name":"IA à l'appel (x402)","short":"Appels x402","how":"Une signature paie un appel, 0,01 USDC en testnet, réglé sur Arc."},"4":{"name":"Copilote attesté","short":"Copilote","how":"Le copilote gratuit du site, dans sa propre enclave : il répond dans le panneau du copilote des pages du site."},"5":{"name":"Prime de démonstration","short":"Prime démo","how":"Première pile seulement : une prime de test, utilisée le 15 nov. pour montrer comment une machine menteuse est démasquée."},"6":{"name":"Prime scellée vérifiée (retirée)","short":"Prime retirée","how":"Première pile seulement : remplacée par le produit 7 le 16 nov. après un correctif de sécurité."},"7":{"name":"Prime scellée, niveau vérifié","short":"Prime vérifiée","how":"Seules les machines sur une puce et un datacenter vérifiés sur Arc peuvent la servir (produit 7 sur la première pile, produit 5 sur v3)."}},"events":{"register":"Enclave {pod} démarrée pour {product}, vérifiée par Arc","renew":"La machine {pod} a été revérifiée sur Arc","image":"Empreinte du code de la machine {pod} enregistrée","machine_bound":"La machine {pod} est liée à sa puce sur Arc","poc_token":"Proof of Cloud a déclaré le datacenter de la machine sur Arc","invalidated":"Machine {pod} retirée, son code n'est plus autorisé","retired":"Machine {pod} retirée par son opérateur","expired":"La vérification de la machine {pod} a expiré","product_proposed":"Nouveau produit proposé : {product}","product_activated":"Produit en service : {product}","product_update":"Produit mis à jour après son délai : {product}","manifest_update":"Lien de description modifié : {product}","image_proposed":"Nouveau code proposé pour {product}","image_allowed":"Nouveau code autorisé pour {product}","image_retired":"Ancien code retiré pour {product}","bond_posted":"Un opérateur a bloqué {amount} USDC de caution","bond_reserved":"Caution réservée pour la machine {pod}","bond_released":"Caution libérée de la machine {pod}","unbond":"Un opérateur de démonstration demande à retirer sa caution","slashed":"{amount} USDC de caution saisis","exposure":"Travail payé compté dans le plafond journalier de l'opérateur","session_opened":"Un client a prépayé une session de {amount} USDC","settled":"Opérateur payé {amount} USDC sur la session","session_closed":"Session fermée, {amount} USDC remboursés","call_settled":"Appel payé, {amount} USDC pour l'opérateur","verdict_ok":"Verdict {verdict}/100 écrit dans ERC-8004","verdict_bad":"Verdict {verdict}/100 écrit, la réclamation était fausse","bounty_created":"Un protocole a financé une prime de {amount} USDC","claim_accepted":"Réclamation acceptée après un rejeu sur une copie d'Arc","exploit_delivered":"Rapport scellé remis au protocole","bounty_paid":"Chasseur payé {amount} USDC pour un vrai exploit","claim_refuted":"Deux rejeux ont réfuté la réclamation de la machine {pod}","admin":"Contrats d'Arc reliés entre eux","policy":"Un produit exige désormais le niveau vérifié"},"acts":[{"title":"v2.1 · Ouverture du réseau","story":"14 nov., la première pile (v2.1). Les contrats sont câblés, l'opérateur bloque une caution de 8 USDC et quatre produits sont mis en service."},{"title":"v2.1 · Premiers travaux payés","story":"Des machines passent le portique, des appels sont payés, une session tourne et un chasseur touche 0,5 USDC pour un vrai exploit."},{"title":"v2.1 · Une machine menteuse démasquée","story":"15 nov. Une machine de démonstration dépose une fausse réclamation. Deux rejeux honnêtes la réfutent et sa caution de 1 USDC est saisie."},{"title":"v2.1 · Le niveau vérifié","story":"Nouveau code pour trois produits, machines revérifiées, et le datacenter de la machine déclaré sur Arc par Proof of Cloud."},{"title":"v2.1 · Produit 7","story":"16 nov. Une Prime scellée que seules les machines vérifiées peuvent servir, avec une cagnotte de 1 USDC."},{"title":"v2.1 · Régime de croisière","story":"Depuis, chaque machine en service est revérifiée sur Arc environ toutes les 12 heures."}],"about":{"title":"D'où viennent les données","paras":["L'histoire enregistrée est la première pile d'ArcHive, v2.1 (deployments.v21.testnet.json), lue dans son API publique et l'explorateur d'Arc le 17 nov. 2026 à 23 h 40 UTC. En direct, la salle suit la pile v3 (deployments.v3.testnet.json, déployée le 19 nov. 2026).","Le rejeu joue les 261 événements de la première pile, inscrits sur Arc entre le 9 et le 17 nov., dans l'ordre et plus vite que le temps réel, puis ceux que l'API en direct donne depuis. Les heures creuses sont sautées. Le fil relie chaque événement à sa transaction.","La page lit l'API en direct (la pile v3) et montre le réseau tel qu'il est maintenant : les baies v3 s'allument, celles de la première pile restent comme histoire. Quand l'API est injoignable, elle montre l'état de la première pile au 17 nov.","C'est un testnet construit par l'équipe ArcHive. Tous les opérateurs à ce jour, y compris les trois identités de la démonstration de réfutation, appartiennent à l'équipe, tout comme les portefeuilles payeurs. Les prix sont volontairement élevés pour que chaque paiement apparaisse dans l'explorateur.","Les couleurs montrent ce que la chaîne enregistre : vérifications passées, sessions, réclamations réfutées. Elles ne disent rien de plus sur la disponibilité des machines.","Les clients, les techniciens et le tube sont une mise en scène ; chaque événement du fil est une vraie transaction sur Arc. Modèles 3D : Factory Kit, Space Station Kit, Furniture Kit, Mini Shop et Mini Characters de Kenney (CC0) ; baies : « Data center rack » d'Animase (NodeStar) sur Sketchfab, licence Free Standard."],"events":"{n} événements","liveReplay":"Le rejeu joue dans l'ordre les événements inscrits sur Arc depuis le 14 nov. : ceux de la première pile (v2.1), puis à partir du 19 nov. ceux de v3, qui a tourné à côté jusqu'à la bascule ({n} à ce jour), plus vite que le temps réel. Les heures creuses sont sautées. Le fil relie chaque événement à sa transaction.","live":"Ici, la page lit l'API d'ArcHive toutes les 20 secondes, sur la pile en service (v3) : une nouvelle clé reçoit sa baie, et chaque nouvel événement est joué dès qu'il arrive, à l'heure de son bloc sur Arc. Les baies de la première pile restent comme histoire."},"settings":{"title":"Réglages","language":"Langue","pace":"Vitesse du rejeu","mode":"Afficher","modeLive":"Le réseau en direct","modeReplay":"Rejouer l'histoire","modeHint":"Le direct lit l'API d'ArcHive toutes les 20 secondes.","motion":"Animations","motionHint":"","follow":"La caméra suit l'action","on":"Oui","off":"Non","jump":"Aller à un moment de l'histoire"},"toasts":{"replayStart":"Rejeu de la vraie histoire du réseau, en accéléré","replayEnd":"Rejeu terminé. Voici le dernier état connu.","liveOn":"Données en direct activées","liveOff":"Données en direct coupées","follow":"La caméra suit l'action","followDone":"","noLive":"Le direct est injoignable pour le moment. État affiché : 17 nov.","liveNew":"Nouveau sur Arc : {n} événements","liveNew1":"Nouveau sur Arc : 1 événement","skipNow":"Voici le réseau maintenant, en direct. Rejouez son histoire avec le bouton de rejeu."},"errors":{"models":"La salle des serveurs n'a pas pu charger ses modèles 3D.","live":"Rechargez la page pour réessayer.","noWebgl":"Cet appareil ne peut pas afficher la salle en 3D : WebGL est coupé ou indisponible.","noWebglLink":"Voir les mêmes enclaves dans la ruche de la console"},"ticker":{"title":"Sur Arc","empty":"Les événements s'affichent ici au fil de l'eau."},"speech":{"ask":"{service}, s'il vous plaît !","thanks":"Merci !","start":"Je démarre une enclave : {service}","publish":"Mise à jour du produit sur Arc"},"find":{"title":"Chercher une baie ou une transaction","placeholder":"Clé, opérateur, service ou hash de transaction","hint":"Les archives gardent chaque transaction vue par la salle depuis le 14 nov., sur les deux piles ({n} à ce jour ; une transaction peut porter plusieurs événements).","racks":"Baies","live":"Baies en service","txs":"Transactions","recent":"Dernières transactions","none":"Aucun résultat. Collez tout ou partie d'une clé, d'une adresse ou d'un hash de transaction."},"stacks":{"first":"{name}, la première pile (depuis le 14 nov.)","live":"{name}, la pile en service (depuis le 19 nov.)","liveAct":{"title":"La pile {name}","story":"19 nov. Les mêmes contrats, redéployés en {name}. Les deux piles tournent côte à côte jusqu'à la bascule ; ensuite {name} sert seule, et l'histoire {first} reste telle qu'elle a eu lieu."}}}}</script>
