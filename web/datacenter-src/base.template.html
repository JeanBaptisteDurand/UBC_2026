<title>ArcHive Base</title>
<meta name="description" content="A live 3D base built from Kenney's Space Kit: every pod is a real ArcHive enclave on Arc testnet. Replay the network's real history, then explore its state.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800;900&family=Chivo+Mono:wght@400;500&display=swap">
<style>
:root {
  /* Layout: a full-screen 3D scene, with a glass HUD at the edges: brand and tour top left, tools top right, act and
     stepper top centre, ticker bottom left, status bottom centre, panels on the right, tour card bottom centre.
     One deliberate dark look (the --space colours). */
  --space: #0A0F1F;
  --space-2: #151C38;
  --glass: rgba(16, 21, 41, .84);
  --glass-strong: rgba(14, 18, 36, .94);
  --line: rgba(190, 200, 255, .14);
  --text: #EEF1FB;
  --muted: #A6AED0;
  --accent: #5B8CFF;
  --kit: #FFA034;
  --good: #34D399;
  --session: #5B8CFF;
  --warn: #FBBF24;
  --bad: #F87171;
  --retired: #7B8194;
  --font: "Chivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Chivo Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background-color: var(--space);
  background-image: radial-gradient(120% 90% at 58% 42%, var(--space-2) 0%, var(--space) 62%);
  color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#stars, #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#stars { z-index: 0; pointer-events: none; }
#stage { z-index: 1; touch-action: none; cursor: default; }
#stage.hot { cursor: pointer; }
.labels { position: fixed !important; inset: 0; pointer-events: none; z-index: 2; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass {
  background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
  box-shadow: 0 14px 40px -18px rgba(0, 0, 0, .7);
}

/* top left: brand and tour */
.topleft {
  position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 9px 15px 9px 11px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { display: block; font-size: 17px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.brand span { display: block; font-size: 12px; color: var(--muted); line-height: 1.25; }
.btn-tour {
  display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 8px 15px;
  background: linear-gradient(180deg, #FFB65A, #F38E1F); color: #1B1206; font-weight: 800; font-size: 14px;
  box-shadow: 0 8px 24px -10px rgba(255, 160, 52, .8);
}
.btn-tour svg { width: 16px; height: 16px; }

/* top right: tools */
.tools {
  position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 56vw;
}
.ibtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 42px; height: 42px; padding: 0 12px;
  border-radius: 13px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; font-weight: 700; font-size: 13.5px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); text-decoration: none;
}
.ibtn svg { width: 18px; height: 18px; flex: none; }
.ibtn:hover { border-color: rgba(190, 200, 255, .32); }
.ibtn.primary { background: var(--accent); border-color: transparent; color: #0A0F1F; }
.ibtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* top centre: act banner, replay clock, journey stepper */
.topcenter {
  position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; max-width: min(560px, 46vw);
}
.act { padding: 8px 16px 9px; text-align: center; opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; }
.act.on { opacity: 1; transform: none; }
.act small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--kit); }
.act b { display: block; font-size: 15.5px; font-weight: 800; }
.act span { display: block; font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 4px; padding: 5px; pointer-events: auto; }
.stepper button {
  border: 0; background: none; cursor: pointer; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.stepper button.on { background: rgba(91, 140, 255, .22); color: var(--text); }
.stepper i { color: rgba(190, 200, 255, .35); font-style: normal; font-size: 12px; }

/* bottom left: ticker */
.ticker {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  width: min(380px, 40vw); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px;
}
.ticker h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
.ticker h3 em { font-style: normal; font-family: var(--mono); color: var(--kit); font-weight: 500; letter-spacing: 0; }
.tick { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; padding: 4px 4px; border-radius: 8px; font-size: 13px; line-height: 1.35; animation: tickin .35s ease; }
.tick button { all: unset; cursor: pointer; }
.tick button:hover b { text-decoration: underline; }
.tick i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
.tick b { font-weight: 500; }
.tick small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tick a { font-family: var(--mono); font-size: 11px; color: var(--muted); }
@keyframes tickin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* bottom centre: status pill */
.status {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; align-items: center; gap: 0; padding: 6px 8px; border-radius: 999px; max-width: calc(100vw - 32px);
  font-size: 13px; font-weight: 600; white-space: nowrap; overflow-x: auto; scrollbar-width: none;
}
.status::-webkit-scrollbar { display: none; }
.status > span { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.status > span:last-child { border-right: 0; }
.status svg { width: 15px; height: 15px; opacity: .8; }
.mode { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--kit); display: inline-block; }
.mode.live i { background: var(--good); box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }

/* right panel */
.panel {
  position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 170px); overflow: auto; padding: 18px 18px 16px;
  transform: translateX(16px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
.panel.on { transform: none; opacity: 1; pointer-events: auto; }
.panel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.panel h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
.panel .x { border: 0; background: rgba(190, 200, 255, .1); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; flex: none; }
.panel p { margin: 0 0 10px; color: var(--text); font-size: 14px; }
.panel .muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.kv code { font-family: var(--mono); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.panel .fact { font-family: var(--mono); font-size: 12px; color: var(--kit); background: rgba(255, 160, 52, .09); border-radius: 10px; padding: 8px 10px; }
.legend-list { list-style: none; margin: 4px 0 12px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.legend-list li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 13.5px; }
.legend-list i { width: 14px; height: 14px; border-radius: 4px; transform: translateY(3px); }
.legend-list b { display: block; }
.legend-list span { color: var(--muted); font-size: 12.5px; }
.panel ul.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 13.5px; }
.field label { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 11px; background: rgba(190, 200, 255, .08); flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #0A0F1F; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.field small { color: var(--muted); font-size: 12px; }
.panel .link { display: inline-flex; margin-top: 4px; font-weight: 700; font-size: 13.5px; color: var(--accent); text-decoration: none; }

/* tour card */
.tour {
  position: fixed; z-index: 8; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translate(-50%, 12px);
  width: min(500px, calc(100vw - 32px)); padding: 18px 20px 16px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  background: var(--glass-strong);
}
.tour.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.tour .ico { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 160, 52, .16); display: grid; place-items: center; margin-bottom: 10px; }
.tour .ico svg { width: 20px; height: 20px; color: var(--kit); }
.tour h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; }
.tour p { margin: 0; color: var(--text); font-size: 15px; line-height: 1.55; }
.tour footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(190, 200, 255, .25); }
.dots i.on { background: var(--kit); width: 18px; border-radius: 4px; }
.tour .actions { display: flex; gap: 8px; }
.tbtn { border: 0; border-radius: 11px; padding: 9px 15px; cursor: pointer; font-weight: 800; font-size: 14px; background: rgba(190, 200, 255, .1); }
.tbtn.next { background: linear-gradient(180deg, #FFB65A, #F38E1F); color: #1B1206; }
.dim { position: fixed; inset: 0; z-index: 3; background: rgba(6, 9, 20, .22); opacity: 0; pointer-events: none; transition: opacity .3s; }
.dim.on { opacity: 1; }

/* tooltip, toast, bubbles, 3D labels */
.tooltip {
  position: fixed; z-index: 9; pointer-events: none; padding: 9px 11px; border-radius: 12px; font-size: 12.5px; max-width: 250px;
  background: var(--glass-strong); border: 1px solid var(--line); opacity: 0; transition: opacity .15s;
}
.tooltip.on { opacity: 1; }
.tooltip b { display: block; font-size: 13px; }
.tooltip span { color: var(--muted); }
.toast {
  position: fixed; z-index: 9; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); left: 50%; transform: translate(-50%, 8px);
  padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  background: var(--glass-strong); border: 1px solid var(--line); max-width: calc(100vw - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.zlabel {
  font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: #F6F2EC; padding: 3px 8px; border-radius: 8px;
  background: rgba(10, 15, 31, .62); border: 1px solid rgba(255, 255, 255, .12); white-space: nowrap; transition: opacity .3s;
}
.zlabel.off { opacity: 0; }
.badge3d {
  font: 800 12px/1 var(--font); padding: 5px 8px; border-radius: 9px; white-space: nowrap; color: #0A0F1F;
  box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .6); animation: rise 2.6s ease forwards;
}
@keyframes rise { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
.bubble {
  font: 700 12px/1.25 var(--font); background: #FFFFFF; color: #14182B; padding: 6px 9px; border-radius: 11px; white-space: nowrap;
  box-shadow: 0 8px 18px -10px rgba(0, 0, 0, .7); opacity: 0; transform: translateY(5px); transition: opacity .25s, transform .25s; position: relative;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px; background: #FFF; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.bubble.on { opacity: 1; transform: none; }
.layerlabel { font: 800 12.5px/1.2 var(--font); color: #DDE6FF; padding: 4px 9px; border-radius: 9px; background: rgba(40, 70, 170, .55); border: 1px solid rgba(160, 190, 255, .4); white-space: nowrap; transition: opacity .3s; }

#loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--space); transition: opacity .6s, visibility .6s; }
#loader.done { opacity: 0; visibility: hidden; }
#loader .box { width: min(320px, 80vw); }
#loader p { margin: 0 0 12px; font-weight: 800; font-size: 15px; }
#loader .track { height: 4px; border-radius: 4px; background: rgba(190, 200, 255, .15); overflow: hidden; }
#loader .fillbar { height: 100%; width: 0; background: var(--kit); transition: width .2s; }
#loader small { display: block; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1100px) {
  .topcenter { display: none; }
  .ticker { width: min(330px, 46vw); }
}
@media (max-width: 760px) {
  .brand span { display: none; }
  .brand { padding: 7px 12px 7px 9px; }
  .brand b { font-size: 15px; }
  .ibtn .txt { display: none; }
  .ibtn { min-width: 38px; height: 38px; padding: 0 9px; }
  .tools { max-width: 60vw; gap: 6px; }
  .status { font-size: 11.5px; border-radius: 16px; flex-wrap: wrap; justify-content: center; white-space: normal; padding: 4px 6px; }
  .status > span { padding: 3px 8px; border-right: 0; }
  .status .opt { display: none; }
  .ticker { left: 12px; right: 12px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 108px); padding: 8px 10px 6px; }
  .toast { top: calc(env(safe-area-inset-top, 0px) + 118px); bottom: auto; transform: translate(-50%, -8px); }
  .ticker .tick:nth-of-type(n+3) { display: none; }
  .tour { bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); padding: 15px 16px 14px; }
  .tour h2 { font-size: 18px; }
  .tour p { font-size: 14.5px; }
  .panel { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-height: 62vh; left: 12px; right: 12px; width: auto; }
  .zlabel { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) {
  .act, .panel, .tour, .tooltip, .toast, .bubble, .zlabel, .layerlabel, #loader, .dim { transition: none; }
  .tick, .badge3d { animation: none; }
}
</style>

function buildLayers() {

    const shape = new THREE.Shape();
    const R = 3.95 - i * 0.18;
    for (let k = 0; k < 6; k++) { const a = (Math.PI / 3) * k; const x = Math.cos(a) * R, z = Math.sin(a) * R; if (k) shape.lineTo(x, z); else shape.moveTo(x, z); }

    const sheet = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: '#5B8CFF', transparent: true, opacity: 0.0, depthWrite: false, side: THREE.DoubleSide }));
    sheet.renderOrder = 10 + i;
    const pts = shape.getPoints().map((p) => V3(p.x, 0, p.y));
    const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#9DB7FF', transparent: true, opacity: 0.0 }));
    edge.renderOrder = 20 + i;

function updateLayers(dt) {

const agents = [];

      const clip = THREE.AnimationClip.findByName(g.animations, n);

function buildBeats() {
  const tl = DATA.timeline;

  tl.forEach((e, i) => {
    if (!cur || cur.tx !== e.tx) { cur = { tx: e.tx, t: e.t, b: e.b, evs: [], idx: i }; beats.push(cur); }
    cur.evs.push(e);

    b.main = b.evs[0];

/* the choreography of each kind of beat */
async function arrive(pod, fast) {
  const s = PLAN.get(pod.id);
  if (!s) return;
  setPodState(pod, 'checking');
  /* the cargo craft brings the pod down onto the pad */
  const carried = pod.grp; carried.visible = true; pod.shown = true;
  const top = V3(Z.pad.x, 7, Z.pad.z - 1), land = cargoHome().add(V3(0.75, 0, -0.85));
  if (cargo && !fast) {
    cargo.position.copy(top);
    carried.position.copy(top).add(V3(0, -0.55, 0));
    await tween(1.4, (k) => { cargo.position.lerpVectors(top, land, k); carried.position.copy(cargo.position).add(V3(0, -0.5 + 0.5 * k, 0)); }, easeOut);
  }
  carried.position.copy(land).setY(0.08);
  crew.say(tr('pod.statuses.checking') || '…', 1.6);
  /* through the gate: amber scan, then a pulse to the dish, then green */
  const g0 = V3(Z.gate.x, 0.95, Z.gate.z + 1.4), g1 = V3(Z.gate.x, 0.95, Z.gate.z - 1.0);
  await tween(fast ? 0.35 : 0.9, (k) => carried.position.lerpVectors(land, g0, k));
  scanOn('#FBBF24');
  await tween(fast ? 0.35 : 1.0, (k) => carried.position.lerpVectors(g0, g1, k));
  const dishTop = dishObj ? dishObj.position.clone().setY(2.7) : Z.dish.clone().setY(2.7);
  const sig = capsule('#FBBF24'); sig.position.copy(g1).setY(1.6);
  await flyAlong(sig, arcPath(sig.position, dishTop, 1.2), fast ? 0.3 : 0.8);
  scene.remove(sig);
  skyBeam(dishTop.clone().setY(1.2), '#9DB7FF', 1.1);
  scanOn('#34D399');
  setPodState(pod, 'live');
  if (gateGlow) { gateGlow.emissive.set('#34D399').multiplyScalar(0.6); wait(1.2).then(() => gateGlow.emissive.setScalar(0)); }
  /* to its socket */
  const dest = s.pos.clone().setY(0.08);
  await flyAlong(carried, arcPath(g1, dest, 1.6), fast ? 0.45 : 1.2);
  seatPod(pod, s);
  ringPulse(dest, STATE_HEX.live, { r1: 1.6, dur: 0.9 });

}
function scanOn(color) {

}

  scene.remove(q);
  skyBeam(dishTop.clone().setY(1.2), '#9DB7FF', 0.8);

async function serve(pod, { amount = 0, ai = false, fast = false, rounds = 1 } = {}) {
  const rover = rovers[0];
  for (let r = 0; r < rounds; r++) {
    client.setBase('interact-right');
    const cap = capsule('#5B8CFF');
    const start = rover ? rover.position.clone() : V3(Z.dock.x - 1, 0, Z.dock.z - 1.4);
    const edge = V3(3.05, 0, 2.25);
    if (rover) await driveRover(rover, [start, V3(4.6, 0, 2.25), edge], cap, fast);
    else { cap.position.copy(start).setY(0.7); await flyAlong(cap, arcPath(cap.position, edge.clone().setY(0.7), 1.2), fast ? 0.4 : 1.2); }
    /* the capsule enters the pod, which serves it (AI products ask the model gateway, off the island) */
    if (pod) {
      await flyAlong(cap, arcPath(cap.position, pod.grp.position.clone().setY(0.55), 1.4), fast ? 0.3 : 0.75);
      scene.remove(cap);
      const prev = pod.state;
      pod.flash = 1;
      if (ai && providerObj && ['1', '3', '4'].includes(pod.info.product)) {
        const a = capsule('#C4B5FD'); a.position.copy(pod.grp.position).setY(0.9);
        await flyAlong(a, arcPath(a.position, Z.provider.clone().setY(Z.provider.y + 0.5), 3), fast ? 0.35 : 0.9);
        await flyAlong(a, arcPath(a.position, pod.grp.position.clone().setY(0.9), 3), fast ? 0.35 : 0.9);
        scene.remove(a);
      } else await wait(fast ? 0.2 : 0.6);
      if (pod.state === 'checking') setPodState(pod, prev);
    } else scene.remove(cap);
    /* the signed answer comes back; the payment goes to the operator */
    const back = capsule('#34D399'); back.position.copy(pod ? pod.grp.position.clone().setY(0.6) : Z.hive.clone());
    if (rover) {
      await flyAlong(back, arcPath(back.position, rover.position.clone().setY(0.72), 1.4), fast ? 0.3 : 0.7);
      await driveRover(rover, [rover.position.clone(), V3(4.6, 0, 2.25), rover.userData.home.clone()], back, fast);
    }
    else await flyAlong(back, arcPath(back.position, V3(Z.dock.x - 1, 0.7, Z.dock.z - 1), 1.2), fast ? 0.4 : 1.0);
    scene.remove(back);
    client.setBase('idle');
    if (amount) { await coinFly(V3(Z.dock.x - 1.2, 0.5, Z.dock.z - 0.4), V3(Z.pad.x, 0.6, Z.pad.z), 2, 2.4); }
  }
}
async function driveRover(rover, pts, cargoObj, fast) {
  const curve = new THREE.CatmullRomCurve3(pts.map((p) => p.clone().setY(0)), false, 'centripetal');
  const len = curve.getLength();
  await tween(Math.max(fast ? 0.4 : 0.9, len / (fast ? 4 : 1.9)), (k) => {
    const p = curve.getPointAt(k); const t = curve.getTangentAt(Math.min(0.999, k));
    rover.position.copy(p); rover.rotation.y = Math.atan2(t.x, t.z) + Math.PI;
    if (cargoObj) cargoObj.position.copy(p).setY(0.72 + Math.sin(k * 30) * 0.01);
  });
}
async function replayAtLab(pod, fast) {
  /* the hunter brings a sealed exploit; the robot replays it on a fork of Arc */

  const ex = capsule('#F87171'); ex.position.set(hunter.pos.x, 0.7, hunter.pos.y);
  await flyAlong(ex, arcPath(ex.position, LABP.engine.clone().setY(0.9), 0.8), fast ? 0.3 : 0.8);
  scene.remove(ex);
  robot.setBase('interact-right');
  tween(0.5, (k) => { labGlow.material.opacity = 0.75 * k; });
  if (pod) { pod.flash = 1; }
  await wait(fast ? 0.5 : 2.0);
  tween(0.6, (k) => { labGlow.material.opacity = 0.75 * (1 - k); });
  robot.setBase('idle');

async function refute(liar, b, fast) {
  /* two other operators replay the same claim and prove it wrong; the liar's bond is seized */
  const honest = [...pods.values()].filter((p) => p.shown && p.info.product === (liar ? liar.info.product : '5') && p !== liar).slice(0, 2);
  for (const h of honest) {
    const c = capsule('#9DB7FF'); c.position.copy(h.grp.position).setY(0.8);
    flyAlong(c, arcPath(c.position, LABP.engine.clone().setY(1.0), 1.6), fast ? 0.4 : 1.1).then(() => scene.remove(c));
  }
  tween(0.5, (k) => { labGlow.material.opacity = 0.8 * k; });
  await wait(fast ? 0.5 : 1.4);
  robot.setBase('emote-no'); robot.say(tr('events.claim_refuted', { pod: liar ? short(liar.id) : '' }).split('.')[0], 2.4);
  tween(0.6, (k) => { labGlow.material.opacity = 0.8 * (1 - k); });
  if (liar) {
    setPodState(liar, 'fault');
    ringPulse(liar.grp.position, STATE_HEX.fault, { r1: 2.2, dur: 1.2 });
    badge(V3(0, 1.25, 0), 'ERC-8004 · 0', STATE_HEX.fault, liar.grp);
    await coinFly(bondVault.position.clone().setY(0.6), V3(Z.dock.x - 1, 0.6, Z.dock.z - 1), 2, 2.4);
  }
  await wait(fast ? 0.3 : 1.0); robot.setBase('idle');
}

/* =================================================================== 12. the director: replay, then the state now */
const director = { mode: 'idle', i: 0, tok: 0, liveOk: false, liveAt: 0 };
function follow(zone, pod) {
  if (!director.follow || tourStep >= 0 || SKIP || store.get('follow') === '0') return;
  const key = pod && zone === 'hive' ? pod.id : zone;
  if (key === lastFocusKey) return;
  if (simT - lastFocusAt < 2.2) { const k = key; wait(2.2).then(() => { if (director.follow && lastFocusKey !== k && simT - lastFocusAt >= 2.2) focus(zone, pod); }); return; }
  focus(pod && zone === 'hive' ? 'pod' : zone, pod);
}
async function startReplay(fromAct = 0) {
  const tok = ++director.tok;
  director.mode = 'replay'; director.follow = true;
  updateReplayButton();
  if (!panelState || panelState.kind !== 'settings') closePanel();
  toast(tr('toasts.replayStart'));
  resetNet(); unseatAll();
  for (const p of pods.values()) { p.verified = false; setPodState(p, 'retired'); }
  setStack(vaultStack, 0); setStack(bondStack, 0); setStack(escrow.userData.stack, 0);
  clearTicks();
  const acts = DATA.acts || [];
  const skipTo = fromAct > 0 && acts[fromAct] && acts[fromAct].first != null ? acts[fromAct].first : -1;
  SKIP = skipTo > 0;
  let lastAct = -2;
  for (let i = 0; i < BEATS.length; i++) {
    if (tok !== director.tok) { SKIP = false; return; }
    director.i = i;
    const b = BEATS[i];
    if (SKIP && b.idx >= skipTo) { SKIP = false; if (tourStep < 0) focus('overview'); }
    const a = actOf(b.idx);
    if (a !== lastAct && a >= 0) { lastAct = a; showAct(a, b.t); if (tourStep < 0 && !SKIP) await wait(1.2); }
    if (tok !== director.tok) { SKIP = false; return; }
    setClock(b.t);
    const steady = a === (DATA.acts || []).length - 1;
    if (steady) { director.steady = (director.steady || 0) + 1; BOOST = director.steady > 3 ? 8 : 1; } else { director.steady = 0; BOOST = 1; }
    const minor =['admin', 'bond_reserved'].includes(b.main.n) || ['SettlementAuthorized', 'SettlementProposed', 'CallerProposed', 'CallerAuthorized', 'AgentIdSet', 'ExposureConsumed', 'BondReserved', 'BondReleased', 'MachineBound', 'EnclaveImage'].includes(b.main.n);
    await playBeat(b, { fast: steady || minor, quiet: false, camera: !minor });
    if (tok !== director.tok) return;
    await wait(steady ? 0.15 : minor ? 0.1 : 0.55);
  }
  if (tok !== director.tok) return;
  endReplay(true);
}
function endReplay(natural) {
  director.tok += 1; director.mode = 'now'; director.follow = false; SKIP = false; BOOST = 1; director.steady = 0;
  const tok = director.tok;

  if (!h) { closePanel(); return; }
  director.follow = false;
  if (h.pod) { focus('pod', h.pod); openPanel('pod', h.pod.id); hideTip(); }
  else if (h.zone) { focus(h.zone === 'layers' ? 'layers' : h.zone); openPanel('zone', h.zone === 'author' ? 'layers' : h.zone); }
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (tourStep >= 0) endTour(); else { closePanel(); focus('overview'); } }
  if (tourStep >= 0 && (e.key === 'ArrowRight' || e.key === 'Enter')) { e.preventDefault(); showTourStep(tourStep + 1); }
  if (tourStep > 0 && e.key === 'ArrowLeft') showTourStep(tourStep - 1);
});

/* =================================================================== 17. wiring, stars, resize, loop */
$('#btn-tour').addEventListener('click', startTour);
$('#tour-next').addEventListener('click', () => showTourStep(tourStep + 1));
$('#tour-back').addEventListener('click', () => showTourStep(Math.max(0, tourStep - 1)));
$('#tour-skip').addEventListener('click', endTour);
$('#btn-legend').addEventListener('click', () => (panelState && panelState.kind === 'legend' ? closePanel() : openPanel('legend')));
$('#btn-about').addEventListener('click', () => (panelState && panelState.kind === 'about' ? closePanel() : openPanel('about')));
$('#btn-settings').addEventListener('click', () => (panelState && panelState.kind === 'settings' ? closePanel() : openPanel('settings')));
$('#btn-lang').addEventListener('click', () => setLang(LANG === 'fr' ? 'en' : 'fr'));
$('#btn-replay').addEventListener('click', () => { if (director.mode === 'replay') endReplay(false); else startReplay(); });

function drawStars() {
  const c = $('#stars'); const dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  let s = 99; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 260; i++) { const a = 0.25 + r() * 0.65; g.fillStyle = `rgba(220,228,255,${a})`; const z = r() < 0.08 ? 1.6 : 0.9; g.fillRect(r() * c.width, r() * c.height, z * dpr, z * dpr); }
}
let W = innerWidth, H = innerHeight, portrait = false;
function resize() {
  W = innerWidth; H = innerHeight; portrait = W / H < 0.9;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, portrait ? 1.6 : 2));
  renderer.setSize(W, H, false); css.setSize(W, H);
  fitBase(); drawStars();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
let hudTick = 0, liveTick = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  runClock(dt);
  for (const a of agents) a.update(dt);
  for (const f of floaters) f.o.position.y = f.y + Math.sin(simT * 0.6 + f.ph) * 0.18;
  for (const f of flyers) { const a = simT * f.sp + f.ph; f.o.position.set(Math.cos(a) * f.r, f.h + Math.sin(a * 2) * 0.4, Math.sin(a) * f.r * 0.7 - 2); f.o.rotation.y = -a + (f.sp > 0 ? 0 : Math.PI); }
  if (dishObj) dishObj.rotation.y = 0.95 + Math.sin(simT * 0.15) * 0.25;
  for (const p of pods.values()) {
    if (!p.shown) continue;
    p.flash = Math.max(0, p.flash - dt * 1.4);
    const lit = p.state !== 'retired';
    const pulse = p.state === 'checking' ? 0.5 + 0.5 * Math.sin(simT * 10) : p.state === 'fault' ? 0.5 + 0.5 * Math.sin(simT * 5) : 0.85 + 0.15 * Math.sin(simT * 2 + p.grp.position.x);
    p.glow.material.opacity = lit ? 0.35 + 0.55 * pulse : 0.3;
    p.beacon.scale.setScalar(1 + p.flash * 0.9);
  }
  updateLayers(dt);
  updateConfetti(dt);
  hudTick += dt; if (hudTick > 0.5) { hudTick = 0; refreshHud(); }
  liveTick += dt; if (liveTick > 20 && director.liveOk) { liveTick = 0; refreshLive(); }
  applyCamera(dt);
  renderer.render(scene, camera); css.render(scene, camera);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) renderer.setAnimationLoop(null); else { clock.getDelta(); renderer.setAnimationLoop(tick); } });
window.__base = { scene, camera, renderer, pods, net, director, view, startReplay, endReplay, focus, openPanel, get tourStep() { return tourStep; } };

async function main() {
  resize();
  $('#load-text').textContent = tr('brand.name') || 'ArcHive';
  await loadPacks();
  buildWorld();
  BEATS = buildBeats();
  applySnapshotState();
  director.mode = 'now';
  applyWords();
  probeLive();
  focus('overview'); view.target.copy(view.wantTarget); view.zoom = view.wantZoom;
  await document.fonts.ready;
  if (boardBlock) { boardBlock.userData.set(''); refreshHud(); }
  renderer.compile(scene, camera);
  $('#loader').classList.add('done');
  clock.getDelta();
  renderer.setAnimationLoop(tick);
  if (!store.get('tourDone')) startTour(); else startReplay();
}
main().catch((err) => {
  console.error(err);
  $('#load-text').textContent = tr('errors.models') || 'The base could not load its 3D models.';
  $('#load-sub').textContent = tr('errors.live') || 'Reload the page to try again.';
});
</script>
