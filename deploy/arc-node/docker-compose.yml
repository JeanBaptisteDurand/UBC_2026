# Optional: an Arc testnet node for the Sealed Bounty's state proofs, on the server (/opt/arc-node), never on a
# workstation (about 84 GB of snapshot; it needs a disk of at least 450 GB, or an archive RPC instead).
# Circle's official compose from circlefin/arc-node v0.8.4 (deployments/docker-compose.yml), with two additions:
#  1. minimal snapshot + custom pruning + --rpc.eth-proof-window=600000: eth_getProof over about 3 days of blocks, for
#     the state proofs of the Sealed Bounty's replay (public RPCs serve them only at the latest block);
#  2. rpc-gate: a READ gateway (closed list of methods, bounded rate) published on 172.17.0.1:8810 (the Docker bridge,
#     never on the Internet); Caddy's /arc-rpc/ route can point at it (deploy/Caddyfile).
# The node is NOT trusted: the enclave checks every proof against the stateRoot of the anchored header.
# Install: deploy/arc-node/install.sh (on the server). Variables: the .env next to it (ARC_HOME, images).
# Docker Compose for running an Arc node in follow mode.
#
# Start:  docker compose up -d    (first run downloads snapshots)
# Stop:   docker compose down
# Logs:   docker compose logs -f
#
# Required environment variables (see docs/running-an-arc-node.md#docker):
#   ARC_EXECUTION_IMAGE  — EL Docker image (e.g. docker.cloudsmith.io/circle/arc-network/arc-execution:0.6.0)
#   ARC_CONSENSUS_IMAGE  — CL Docker image (e.g. docker.cloudsmith.io/circle/arc-network/arc-consensus:0.6.0)
#   ARC_HOME             — data directory on the host (e.g. ~/.arc)

services:
  # --- Initialization (runs once, then exits) ---

  # Download the newest complete v2 EL and CL pair. This runs on every
  # `docker compose up`, not only the first, and never falls back to v1. A layer
  # that already holds the selected snapshot is left alone, so a normal restart
  # finishes in seconds. Two cases do not:
  # once a newer snapshot is published a restart re-downloads the execution layer
  # in full, and after an interrupted download this service exits non-zero and the
  # stack does not start until --force is added below. Both are covered in
  # docs/running-an-arc-node.md#start.
  #
  # Automatic resolution always selects a reth manifest. --el-profile defaults
  # to minimal, but this service passes full to match the arc-execution pruning
  # preset below. Omitting it would restore less history than configured.
  arc-snapshots:
    image: ${ARC_EXECUTION_IMAGE:?ARC_EXECUTION_IMAGE must be set}
    entrypoint: ["/usr/local/bin/arc-snapshots"]
    command:
      - download
      - --chain=arc-testnet
      # MINIMAL profile (state + headers + a small buffer): the full profile (about 270 GB with the consensus layer) does
      # not fit a 290 GB disk (measured: stopped by the guard at 14 GB free). Snapshot pinned to the one Arc published, so
      # its 120 GB are not downloaded again.
      - --el-profile=minimal
      - --execution-url=https://snapshots.arc.network/api/download/testnet/storage-v2/archive/71734683-20261110T1620Z/execution/manifest.json
      - --consensus-url=https://snapshots.arc.network/api/download/testnet/storage-v2/archive/71734683-20261110T1620Z/consensus.tar.lz4
      - --execution-path=/data/execution
      - --consensus-path=/data/consensus
    volumes:
      - ${ARC_HOME:?ARC_HOME must be set}:/data

  # Initialize consensus layer private key
  arc-consensus-init:
    image: ${ARC_CONSENSUS_IMAGE:?ARC_CONSENSUS_IMAGE must be set}
    command:
      - init
      - --home=/data/consensus
    depends_on:
      arc-snapshots:
        condition: service_completed_successfully
    volumes:
      - ${ARC_HOME}/consensus:/data/consensus

  # Set ownership on the shared sockets volume so the EL (UID 999) can write
  arc-sockets-init:
    image: debian:bookworm-slim
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /sockets/*.ipc && chown 999:999 /sockets"]
    volumes:
      - arc-sockets:/sockets
    depends_on:
      arc-consensus-init:
        condition: service_completed_successfully

  # --- Long-running services ---

  # Execution Layer (EL)
  arc-execution:
    image: ${ARC_EXECUTION_IMAGE}
    command:
      - node
      - --chain=arc-testnet
      - --datadir=/data/execution
      # custom pruning (instead of --full): what proofs do not need is pruned; account and storage history is kept for
      # 600,000 blocks (about 3 days at about 0.46 s per block: the Bounty's whole refutation window, about 0.5 GB), and
      # state proofs are served over that window
      - --prune.sender-recovery.full
      - --prune.transaction-lookup.full
      - --prune.receipts.full
      - --prune.account-history.distance=600000
      - --prune.storage-history.distance=600000
      - --prune.bodies.distance=10064
      - --rpc.eth-proof-window=600000
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,txpool,trace,debug
      - --auth-ipc
      - --auth-ipc.path=/sockets/auth.ipc
      - --ipcpath=/sockets/reth.ipc
      - --metrics=0.0.0.0:9001
      - --disable-discovery
      - --enable-arc-rpc
      - --rpc.forwarder=https://rpc.testnet.arc.io/
      - --log.file.directory=/data/execution/logs
    volumes:
      - ${ARC_HOME}/execution:/data/execution
      - arc-sockets:/sockets
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:9001:9001"
    depends_on:
      arc-sockets-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Consensus Layer (CL)
  arc-consensus:
    image: ${ARC_CONSENSUS_IMAGE}
    command:
      - start
      - --home=/data/consensus
      - --eth-socket=/sockets/reth.ipc
      - --execution-socket=/sockets/auth.ipc
      - --rpc.addr=0.0.0.0:31000
      - --follow
      - --follow.endpoint=https://rpc.testnet.arc.io,wss=rpc.testnet.arc.io
      - --follow.endpoint=https://rpc.drpc.testnet.arc.io,wss=rpc.drpc.testnet.arc.io
      - --follow.endpoint=https://rpc.blockdaemon.testnet.arc.io,wss=rpc.blockdaemon.testnet.arc.io/websocket
      - --full
      - --execution-persistence-backpressure
      - --execution-persistence-backpressure-threshold=50
      - --metrics=0.0.0.0:29000
    volumes:
      - ${ARC_HOME}/consensus:/data/consensus
      - arc-sockets:/sockets
    ports:
      - "127.0.0.1:31000:31000"
      - "127.0.0.1:29000:29000"
    depends_on:
      arc-consensus-init:
        condition: service_completed_successfully
      arc-execution:
        condition: service_started
    restart: unless-stopped

  # Read gateway to the node (deploy/arc-node/rpc-gate.mjs): the only public entry, through Caddy
  rpc-gate:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["./rpc-gate.mjs:/app/rpc-gate.mjs:ro"]
    command: ["node", "rpc-gate.mjs"]
    environment: ["PORT=8810", "HOST=0.0.0.0", "UPSTREAM=http://arc-execution:8545"]
    ports:
      - "172.17.0.1:8810:8810"
    depends_on:
      arc-execution:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  arc-sockets:
