<title>Page not found · ArcHive</title>
<style>

  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;

  .code { font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; color: #8a919c; }
  h1 { margin: 14px 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 24px; max-width: 34em; color: #a3a9b3; font-size: 15px; line-height: 1.5; }
  a { display: inline-block; padding: 10px 18px; border: 1px solid #2a2f37; border-radius: 10px; color: #e8eaee;
    text-decoration: none; font-size: 14px; font-weight: 500; }

</style>
</head>

<main>
