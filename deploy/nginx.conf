# ArcHive: the marketplace site at the root, the console under /console/, the 3D server room under /datacenter/, and
# the SAME-ORIGIN proxy to the enclaves.
# Why: a browser can call an enclave on another origin only if it returns CORS headers; through /enclave/…, everything
# is served from the site's origin.
# What this proxy guarantees, and what it does not:
# - between this server and Phala, nginx VERIFIES the enclave's certificate (the container's CA store, exact name): an
#   intermediary on that path cannot pass itself off as the enclave;
# - this server itself stays trusted for the site: it also serves the page's JavaScript, and it relays the x25519 key
#   read on /pubkeys. HPKE encryption therefore hides data from the server only if the client compares that key with
#   the one registered on-chain (EnclaveRegistry.enclaveOf) BEFORE encrypting: that is what the SDK and the CLI do; for
#   sensitive use, go through them rather than through the browser.
# Film of the landing page: film.ts asks for every frame and sheet with ?v=<film version> (the ETag of meta.bin, new
# at every build): those addresses never change content, so they are immutable and a return visit reads the whole film
# from the disk cache; without ?v (the first frame in index.html, older code): 5 minutes.
map $arg_v $film_cc {
  ""      "public, max-age=300";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # no nginx version in headers or error pages
  server_tokens off;

  # relative redirects (/datacenter -> /datacenter/): nginx listens over HTTP behind Caddy; an absolute redirect would
  # send the browser to http://, then Caddy to https:// (two hops)
  absolute_redirect off;

  # unknown paths get the site's small 404 page (404.html, installed by build.sh), not nginx's bare page;
  # the proxied services (api, copilots, mcp) keep their own error answers
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache"; }

  # the old /produits/ links lead to the products page
  location ^~ /produits/ { return 301 /service.html; }

  # DNS resolved on demand (nginx's start does not depend on the other services)
  resolver 127.0.0.11 valid=30s ipv6=off;

  # the marketplace site at the root (a multi-page build: /, /network.html, /service.html, /doc.html, /space.html,
  # /bridge.html…; the page list is in deploy/README.md)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # built files carry their fingerprint in their name: immutable; a missing file is a real 404
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the film frames (see the map above); the metadata compressed here (Caddy only compresses text): meta.bin 1.3 MB of
  # floats -> 0.25 MB, the critical path to the first draw
  location /film/ {
    add_header Cache-Control $film_cc;
    gzip on;
    gzip_types application/octet-stream application/json;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # Caddy adds Via: nginx would otherwise never compress for it
    gzip_proxied any;
    try_files $uri =404;
  }
  # meta.bin gives the film version (its ETag): always revalidated
  location ~ ^/film/[a-z]+/meta\.bin$ {
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types application/octet-stream;
    gzip_comp_level 5;
    gzip_vary on;
    # Caddy adds Via: nginx would otherwise never compress for it
    gzip_proxied any;
    try_files $uri =404;
  }

  # the fonts (font-display: block hides the text until they are there): a day, then served at once while revalidated
  location /fonts/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
  }

  # the console under /console/ (hash routes: #/ruche, #/primes…)
  location /console/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /console/index.html;
  }
  location /console/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the 3D server room: a static folder; a missing file is a real 404
  location /datacenter/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # the operator agent's installer and its package: never cached, always the latest version
  location = /install.sh { add_header Cache-Control "no-store"; default_type text/plain; }
  location = /archive-node.mjs { add_header Cache-Control "no-store"; default_type text/javascript; }

  # v2.1 stack — private inference per session (product 1): the "inference" Intel TDX VM at Phala, production OS image; VERIFIED HTTPS (known CA + exact name)
  location /enclave/inference/ {
    set $inference https://54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/inference/(.*)$ /$1 break;
    proxy_pass $inference;
    proxy_ssl_server_name on;
    proxy_ssl_name 54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Let's Encrypt chain as observed: *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # v2.1 stack — inference paid per call, x402 (product 3): the same VM as inference, another service, other keys
  location /enclave/x402/ {
    set $x402 https://54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/x402/(.*)$ /$1 break;
    proxy_pass $x402;
    proxy_ssl_server_name on;
    proxy_ssl_name 54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Let's Encrypt chain as observed: *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # v2.1 stack — Sealed Bounty (product 2): the "bounty" Intel TDX VM, real replay with arc-anvil; the client checks the key on-chain
  location /enclave/bounty/ {
    set $bounty https://86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/bounty/(.*)$ /$1 break;
    proxy_pass $bounty;
    proxy_ssl_server_name on;
    proxy_ssl_name 86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # Let's Encrypt chain as observed: *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # Sealed Bounty AT THE VERIFIED LEVEL (product 5): its own Intel TDX VM on the machine declared by the Proof of Cloud
  # alliance (prod9).
  location /enclave/bounty-verified/ {
    set $bountyv https://bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/bounty-verified/(.*)$ /$1 break;
    proxy_pass $bountyv;
    proxy_ssl_server_name on;
    proxy_ssl_name bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # v2.1 stack — attested copilot (product 4). The proxy token (COPILOT_PROXY_TOKEN in /opt/archive/nginx.env, never in
  # the repository) is injected when the container starts, by the nginx image's envsubst template: only this proxy can
  # query the enclave, which trusts X-Forwarded-For (set by Caddy) only with that token.
  # The console's former attested copilot path: the console talks to the server copilot (/copilot/) and the attested
  # copilot is /enclave/copilot-site/, so this path answers a clean 404
  location /enclave/copilot/ {
    default_type application/json;
    return 404 '{"error":"not_found","detail":"this enclave is retired: the server copilot is /copilot/, the attested copilot /enclave/copilot-site/"}';
  }

  # AskHive, the SITE copilot, in its enclave (product 4, image v22, COPILOT_SURFACE=site): its own Intel TDX VM (app
  # 8f4fd47e…). The same proxy token (COPILOT_PROXY_TOKEN in /opt/archive/nginx.env = the VM's encrypted variable). The
  # site's panel checks this key on Arc (product 4, allowed image) before it seals the conversation to it.
  location /enclave/copilot-site/ {
    set $copilotsite https://8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/copilot-site/(.*)$ /$1 break;
    proxy_pass $copilotsite;
    proxy_ssl_server_name on;
    proxy_ssl_name 8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header X-Archive-Proxy-Token "${COPILOT_PROXY_TOKEN}";
  }
}
