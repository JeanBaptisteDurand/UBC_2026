# ArcHive (un seul projet depuis le 16/11) : le front de Florent à la racine, la console de JB sous /console/, la salle 3D
# sous /datacenter/, et le proxy de même origine vers les enclaves.
# Site ArcHive + proxy de MÊME ORIGINE vers les enclaves.
# Pourquoi : un navigateur ne peut appeler une enclave d'une autre origine que si elle renvoie des en-têtes CORS ;
# en passant par /enclave/…, tout est servi depuis l'origine du site.
# Ce que ce proxy garantit, et ce qu'il ne garantit pas :
# - entre ce serveur et Phala, nginx VÉRIFIE le certificat de l'enclave (magasin d'autorités du conteneur, nom exact) :
#   un intermédiaire sur ce trajet ne peut plus se faire passer pour l'enclave ;
# - ce serveur lui-même reste de confiance pour le site : il sert aussi le JavaScript de la page, et c'est lui qui
#   relaie la clé x25519 lue sur /pubkeys. Le chiffrement HPKE ne protège donc des yeux du serveur que si le client
#   compare cette clé à celle inscrite on-chain (EnclaveRegistry.enclaveOf) AVANT de chiffrer : c'est le rôle du SDK
#   et de la CLI ; pour un usage sensible, passez par eux plutôt que par le navigateur.
# Film of the landing (19/11): film.ts asks for every frame and sheet with ?v=<film version> (the ETag of meta.bin, new
# at every build): those addresses never change content, so they are immutable and a return visit reads the whole film
# from the disk cache; without ?v (the first frame in index.html, older code): 5 minutes.
map $arg_v $film_cc {
  ""      "public, max-age=300";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # aucune version de nginx dans les en-têtes ni dans les pages d'erreur
  server_tokens off;

  # redirections relatives (/datacenter -> /datacenter/) : nginx écoute en HTTP derrière Caddy ; une redirection absolue
  # renverrait le navigateur vers http://, puis Caddy vers https:// (deux sauts)
  absolute_redirect off;

  # 20/11 : unknown paths get the site's small 404 page (404.html, installed by build.sh), not nginx's bare page;
  # the proxied services (api, copilots, mcp) keep their own error answers
  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache"; }

  # 20/11 : the separate versions of the products page are retired: their old links lead to the products page
  location ^~ /produits/ { return 301 /service.html; }

  # résolution DNS à la demande (le démarrage de nginx ne dépend pas des autres services)
  resolver 127.0.0.11 valid=30s ipv6=off;

  # le front de Florent à la racine (plusieurs pages : /, /use.html, /service.html, /rent.html, /publish.html, /demo.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # les fichiers construits portent leur empreinte dans le nom : immuables ; un fichier absent est un vrai 404
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the film frames (see the map above); the metadata compressed here (Caddy only compresses text): meta.bin 1.3 MB of
  # floats -> 0.25 MB, the critical path to the first draw
  location /film/ {
    add_header Cache-Control $film_cc;
    gzip on;
    gzip_types application/octet-stream application/json;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # Caddy adds Via: nginx would otherwise never compress for it
    gzip_proxied any;
    try_files $uri =404;
  }
  # meta.bin gives the film version (its ETag): always revalidated
  location ~ ^/film/[a-z]+/meta\.bin$ {
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types application/octet-stream;
    gzip_comp_level 5;
    gzip_vary on;
    # Caddy adds Via: nginx would otherwise never compress for it
    gzip_proxied any;
    try_files $uri =404;
  }

  # the fonts (font-display: block hides the text until they are there): a day, then served at once while revalidated
  location /fonts/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
  }

  # la console de JB sous /console/ (routes par hash : #/ruche, #/primes…)
  location /console/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /console/index.html;
  }
  location /console/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # la salle des serveurs 3D : un dossier statique ; un fichier absent est un vrai 404
  location /datacenter/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # l'installeur de l'agent opérateur et son paquet : jamais en cache, toujours la dernière version
  location = /install.sh { add_header Cache-Control "no-store"; default_type text/plain; }
  location = /archive-node.mjs { add_header Cache-Control "no-store"; default_type text/javascript; }

  # pile v2.1 — inférence privée par session (produit 1) : VM Intel TDX « inférence » chez Phala, image système de production ; HTTPS VÉRIFIÉ (autorité reconnue + nom exact)
  location /enclave/inference/ {
    set $inference https://54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/inference/(.*)$ /$1 break;
    proxy_pass $inference;
    proxy_ssl_server_name on;
    proxy_ssl_name 54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # chaîne de Let's Encrypt vue le 7/11 : *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # pile v2.1 — inférence payée à l'appel, x402 (produit 3) : même VM que l'inférence, autre service, autres clés
  location /enclave/x402/ {
    set $x402 https://54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/x402/(.*)$ /$1 break;
    proxy_pass $x402;
    proxy_ssl_server_name on;
    proxy_ssl_name 54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # chaîne de Let's Encrypt vue le 7/11 : *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # pile v2.1 — Prime scellée (produit 2) : VM Intel TDX « prime », rejeu réel par arc-anvil ; le client vérifie la clé sur la chaîne
  location /enclave/bounty/ {
    set $bounty https://86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/bounty/(.*)$ /$1 break;
    proxy_pass $bounty;
    proxy_ssl_server_name on;
    proxy_ssl_name 86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # chaîne de Let's Encrypt vue le 7/11 : *.dstack-pha1-prod9.phala.network → YE1 → Root YE → ISRG Root X2 → X1
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # Prime scellée AU NIVEAU VÉRIFIÉ (produit 7) : sa propre VM Intel TDX sur la machine déclarée par l'alliance Proof
  # of Cloud (prod9).
  location /enclave/bounty-verified/ {
    set $bountyv https://bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/bounty-verified/(.*)$ /$1 break;
    proxy_pass $bountyv;
    proxy_ssl_server_name on;
    proxy_ssl_name bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  # pile v2.1 — copilote attesté (produit 4) : VM Intel TDX « copilote » à part. Le jeton de proxy (variable COPILOT_PROXY_TOKEN de /opt/archive/nginx.env, jamais dans le dépôt) est injecté au démarrage du conteneur par le gabarit envsubst de l'image nginx : seul ce proxy peut poser des questions à l'enclave, qui ne croit X-Forwarded-For (posé par Caddy) qu'avec ce jeton.
  # 20/11 : the console's attested copilot enclave (VM 587736...) is gone and nothing live uses this path any more
  # (the console talks to the server copilot, /copilot/; the attested copilot is /enclave/copilot-site/): a clean 404
  location /enclave/copilot/ {
    default_type application/json;
    return 404 '{"error":"not_found","detail":"this enclave is retired: the server copilot is /copilot/, the attested copilot /enclave/copilot-site/"}';
  }

  # 19/11 — copilote du SITE dans son enclave (produit 4, image v22, COPILOT_SURFACE=site) : VM Intel TDX à part (app
  # 8f4fd47e…). Même jeton de proxy que /enclave/copilot/ (COPILOT_PROXY_TOKEN de /opt/archive/nginx.env = variable chiffrée
  # de la VM). Le panneau du site vérifie cette clé sur Arc (produit 4, image autorisée) avant d'y sceller la conversation.
  location /enclave/copilot-site/ {
    set $copilotsite https://8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    rewrite ^/enclave/copilot-site/(.*)$ /$1 break;
    proxy_pass $copilotsite;
    proxy_ssl_server_name on;
    proxy_ssl_name 8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_set_header Host 8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network;
    client_max_body_size 256k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header X-Archive-Proxy-Token "${COPILOT_PROXY_TOKEN}";
  }
}
