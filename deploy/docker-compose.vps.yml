# ArcHive: the site (marketplace at the root, console under /console/, 3D room), the API, both copilots (console and
# site), the MCP server over HTTP and the registrars. Installed by deploy/deploy.sh.
# The API, both copilots and the MCP server read the v3 stack: each mounts its v3 bundle (*.v3.mjs) and the v3
# deployment file, read-only (DEPLOYMENTS). build.sh writes api.mjs, copilot.mjs and mcp-http.mjs: install a new build
# under the .v3.mjs name before restarting its service.
name: archive
# Images pinned by digest (read with docker image inspect): a pull cannot change anything silently. To upgrade:
# docker pull <image:tag>, read the new digest, replace it here.
# Every container: no new privileges (no-new-privileges), no Linux capability except the ones it uses; the Node
# services run as the node user (uid 1000) on a read-only file system.
# Rotating logs (3 × 10 MB per container): a flood of requests cannot fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
services:
  # HTTPS: automatic certificates for arc-hive.xyz and archive.62-171-153-35.sslip.io (deploy/Caddyfile)
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports: ["80:80", "443:443"]
    # optional: the gateway of an Arc archive node (/arc-rpc/, deploy/arc-node) listens on the host's Docker bridge (172.17.0.1:8810)
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["/opt/archive/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: ["web", "api", "copilot", "copilot-site", "mcp"]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"] # listen on 80 and 443
  web:
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    # nginx.conf is a TEMPLATE: at start, the image replaces ${COPILOT_PROXY_TOKEN} in it (and nothing else, see the
    # filter below) with the value from /opt/archive/nginx.env (outside the repository, 0600); the token never lives in the code.
    volumes: ["/opt/archive/web:/usr/share/nginx/html:ro", "/opt/archive/nginx.conf:/etc/nginx/templates/default.conf.template:ro"]
    env_file: ["/opt/archive/nginx.env"]
    environment: ["NGINX_ENVSUBST_FILTER=^COPILOT_PROXY_TOKEN$$"]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # the master process (root) listens on 80, prepares its temporary folders, then runs its workers as "nginx"
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
  # Once per "up": the data folder belongs to the API's user (uid 1000). Idempotent; exits at once (no network). The API
  # starts only after it.
  data-perms:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "0:0"
    volumes: ["/opt/archive/data:/data"]
    command: ["chown", "-R", "1000:1000", "/data"]
    network_mode: none
    restart: "no"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_READ_SEARCH"]
  api:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    # each service sees ONLY its own file (never the others' .env: deployer key, test-mode token)
    # /data: the only writable folder (paired machines, arcop_ key fingerprints, index, test-mode budget)
    volumes: ["/opt/archive/api.v3.mjs:/app/api.mjs:ro", "/opt/archive/data:/data", "/opt/archive/src/deployments.v3.testnet.json:/app/deployments.v3.testnet.json:ro"]
    command: ["node", "api.mjs"]
    environment: ["PORT=8809", "DATA_DIR=/data", "WEB_URL=https://archive.62-171-153-35.sslip.io", "DEPLOYMENTS=/app/deployments.v3.testnet.json"]
    # test mode (testnet): a funded server wallet + token; without this file, test mode is simply off
    env_file:
      - path: /opt/archive/test-signer.env
        required: false
    depends_on:
      data-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  copilot:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/copilot.v3.mjs:/app/copilot.mjs:ro", "/opt/archive/src/deployments.v3.testnet.json:/app/deployments.v3.testnet.json:ro"]
    command: ["node", "copilot.mjs"]
    env_file: ["/opt/archive/copilot.env"]
    # two copilots, each with at most 1,000 model calls per day (2,000 in total)
    environment: ["COPILOT_GLOBAL_PER_DAY=1000", "DEPLOYMENTS=/app/deployments.v3.testnet.json"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # AskHive, the site copilot (the same code as "copilot", "site" surface: it guides the visitor through the site's pages)
  copilot-site:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/copilot.v3.mjs:/app/copilot.mjs:ro", "/opt/archive/src/deployments.v3.testnet.json:/app/deployments.v3.testnet.json:ro"]
    command: ["node", "copilot.mjs"]
    env_file: ["/opt/archive/copilot.env"]
    # the site copilot drives the pages AFTER reading the data, so a second tool round must stay allowed (the estimate
    # counts 3 tokens per accented character, and the site's prompt is partly French). Cost capped by COPILOT_GLOBAL_PER_DAY.
    environment: ["COPILOT_SURFACE=site", "COPILOT_GLOBAL_PER_DAY=1000", "COPILOT_MAX_INPUT_TOKENS=120000", "COPILOT_MAX_INPUT_CHARS=320000", "DEPLOYMENTS=/app/deployments.v3.testnet.json"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # MCP server over HTTP (stateless, no key: reads and PREPARED actions only)
  mcp:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/mcp-http.v3.mjs:/app/mcp-http.mjs:ro", "/opt/archive/src/deployments.v3.testnet.json:/app/deployments.v3.testnet.json:ro"]
    command: ["node", "mcp-http.mjs"]
    environment: ["MCP_PORT=8812", "ARCHIVE_API=http://api:8809", "RPC_URL=https://rpc.testnet.arc.io", "DEPLOYMENTS=/app/deployments.v3.testnet.json"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # v2.1 stack (SDK `testnet`), kept as history: these registrars are not running on the server. The live registrars
  # are the five of the v3 stack, in docker-compose.v3-registrars.yml (a separate Compose project).
  # One registrar per enclave. Each renews the registration through DCAP before its window ends (checked every
  # 10 min); those of the paid products also settle what the enclave served (sessions, x402 calls).
  registrar-inference:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/registrar.mjs:/app/registrar.mjs:ro"]
    command: ["node", "registrar.mjs"]
    # the OPERATOR's key only (0x344f…2e1a): the deployer key, which owns the contracts, does not live on this server
    env_file: ["/opt/archive/registrar-v2.env"]
    environment: ["ENCLAVE_URL=https://54623c0974ceed19ccbcf121548937016f8cbab8-8802.dstack-pha1-prod9.phala.network", "PRODUCT_ID=1", "SETTLE=1"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # inference paid per call (x402): renews and settles the calls served (every 10 s)
  registrar-x402:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/registrar.mjs:/app/registrar.mjs:ro"]
    command: ["node", "registrar.mjs"]
    # the OPERATOR's key only (0x344f…2e1a): the deployer key, which owns the contracts, does not live on this server
    env_file: ["/opt/archive/registrar-v2.env"]
    environment: ["ENCLAVE_URL=https://54623c0974ceed19ccbcf121548937016f8cbab8-8804.dstack-pha1-prod9.phala.network", "PRODUCT_ID=3", "SETTLE=1"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # Sealed Bounty: renews only (bounties are paid in the acceptClaim → deliver flow)
  registrar-bounty:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/registrar.mjs:/app/registrar.mjs:ro"]
    command: ["node", "registrar.mjs"]
    # the OPERATOR's key only (0x344f…2e1a): the deployer key, which owns the contracts, does not live on this server
    env_file: ["/opt/archive/registrar-v2.env"]
    environment: ["ENCLAVE_URL=https://86400c7d73335cf87524acf9cf6590fec3e7c271-8803.dstack-pha1-prod9.phala.network", "PRODUCT_ID=2", "SETTLE=0"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # Sealed Bounty AT THE VERIFIED LEVEL (product 5): renews through DCAP, binds the enclave to its machine after each
  # renewal, and asks the Proof of Cloud alliance for a new token before the current one expires (verified level)
  registrar-bounty-verified:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/registrar.mjs:/app/registrar.mjs:ro"]
    command: ["node", "registrar.mjs"]
    # the OPERATOR's key only (0x344f…2e1a): the deployer key, which owns the contracts, does not live on this server
    env_file: ["/opt/archive/registrar-v2.env"]
    environment: ["ENCLAVE_URL=https://bd32db73ff811e3424dad660ebcbd0c819ed3a8f-8803.dstack-pha1-prod9.phala.network", "PRODUCT_ID=7", "SETTLE=0"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  # attested copilot (product 4): renews only (free service). The enclave of AskHive, the SITE copilot (image v22,
  # COPILOT_SURFACE=site, VM 8f4fd47e…), behind nginx.conf's /enclave/copilot-site/ route.
  registrar-copilot:
    image: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    user: "1000:1000"
    working_dir: /app
    volumes: ["/opt/archive/registrar.mjs:/app/registrar.mjs:ro"]
    command: ["node", "registrar.mjs"]
    # the OPERATOR's key only (0x344f…2e1a): the deployer key, which owns the contracts, does not live on this server
    env_file: ["/opt/archive/registrar-v2.env"]
    environment: ["ENCLAVE_URL=https://8f4fd47e27d281343b5ef9ee8a303717d2763997-8808.dstack-pha1-prod9.phala.network", "PRODUCT_ID=4", "SETTLE=0"]
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  caddy_data:
  caddy_config:
