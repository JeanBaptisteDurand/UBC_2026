<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArcHive. Film capture</title>
    <!-- Development page, not part of the build (vite.config.ts PAGES): the landing film is captured from it frame by
         frame (tournage.html?tournage, see src/clock.ts). -->
    <meta name="description" content="Use a service, rent out your Intel TDX machine, or publish your own. Arc verifies every enclave, and paid uses settle in USDC. Read live on Arc testnet." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#060708" />
    <meta property="og:title" content="ArcHive. Sealed machines, open market." />
    <meta property="og:description" content="Use a service, rent out your Intel TDX machine, or publish your own. Arc verifies every enclave, and paid uses settle in USDC." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Brand font through a single variable (--brand); Montserrat (OFL) is the web font in use. */
      @font-face { font-family: 'Montserrat'; src: url('/fonts/montserrat-wght.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
      :root { --brand: 'Montserrat'; }
      html, body { background: #060708; color: #e9e7e2; margin: 0; }
      #root .page > .hero { padding: calc(86px + 62px) 72px 0; min-height: 100svh; box-sizing: border-box; }
      #root .page > .hero .h1 { font: 500 clamp(52px, 6.2vw, 96px)/0.92 var(--brand), ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; max-width: 7em; }
      @media (max-width: 760px) { #root .page > .hero { padding: calc(84px + 30svh) 16px 0; } #root .page > .hero .h1 { font-size: 11.4vw; } }
    </style>
    <link rel="preload" href="/fonts/montserrat-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fragment-mono.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"><main class="page"><section class="sec hero"><div class="txt"><h1 class="h1">Sealed machines,<br>open market.</h1></div></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
