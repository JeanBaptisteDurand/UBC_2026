# Prime scellée, pile v2 (Arc testnet, produit 2) : rejeu RÉEL (fork d'Arc au bloc N par anvil). Tout est mesuré ;
# seuls OPERATOR_ALLOWLIST et les identifiants du registre d'images sont des variables chiffrées.
services:
  sealed-bounty:
    image: ghcr.io/jeanbaptistedurand/archive-sealed-bounty@sha256:cf2b1e36d40025849c07b2e3b2dbadb5cccede61258250cef73fd8e0ddd4a129
    ports:
      - "8803:8803"
    environment:
      - RPC_URL=https://rpc.testnet.arc.io
      - FORK_RPC_URL=https://rpc.testnet.arc.io
      - CHAIN_ID=5042002
      - PRODUCT_ID=2
      - REGISTRY=0x54AeCc6500a1CfB33FD5BFB3008ed7A600Ae7d38
      - SEALEDBOUNTY=0xaC8949a108e8288aBe0DdC5b5A4120De4636E4BF
      - OPERATOR_ALLOWLIST=${OPERATOR_ALLOWLIST}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    restart: unless-stopped
