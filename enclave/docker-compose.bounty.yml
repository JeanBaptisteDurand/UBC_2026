# app-compose dstack pour Phala Cloud : la machine « Prime scellée » (O3), rejeu RÉEL par anvil (fork d'Arc au bloc N).
# Déploiement : phala deploy -c docker-compose.bounty.yml -t tdx.small --name archive-sealed-bounty
# Tout ce qui est écrit ici est mesuré (mrConfigId → workloadId) : adresses, produit, RPC. OPERATOR_ALLOWLIST est
# une variable chiffrée (allowed_envs), non mesurée, pour que la même image serve n'importe quel opérateur cautionné.
services:
  sealed-bounty:
    image: ghcr.io/jeanbaptistedurand/archive-sealed-bounty@sha256:${IMAGE_DIGEST}
    ports:
      - "8803:8803"
    environment:
      - RPC_URL=https://rpc.testnet.arc.io
      - FORK_RPC_URL=https://rpc.testnet.arc.io
      - CHAIN_ID=5042002
      - PRODUCT_ID=${PRODUCT_ID}
      - REGISTRY=${REGISTRY}
      - SEALEDBOUNTY=${SEALEDBOUNTY}
      - OPERATOR_ALLOWLIST=${OPERATOR_ALLOWLIST}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock   # agent invité dstack (vrai quote TDX)
    restart: unless-stopped
