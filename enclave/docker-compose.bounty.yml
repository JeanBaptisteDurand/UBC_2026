# dstack app-compose for Phala Cloud: the Sealed Bounty machine (O3), a REAL replay by anvil (a fork of Arc at block N).
# Deployment: phala deploy -c docker-compose.bounty.yml -t tdx.small --name archive-sealed-bounty
# Everything written here is measured: addresses, product, RPC. OPERATOR_ALLOWLIST is an encrypted variable
# (allowed_envs), not measured, so that the same image can serve any bonded operator.
services:
  sealed-bounty:
    image: ghcr.io/jeanbaptistedurand/archive-sealed-bounty@sha256:${IMAGE_DIGEST}
    ports:
      - "8803:8803"
    environment:
      - RPC_URL=https://rpc.testnet.arc.io
      - FORK_RPC_URL=https://rpc.testnet.arc.io
      - CHAIN_ID=5042002
      - PRODUCT_ID=${PRODUCT_ID}
      - REGISTRY=${REGISTRY}
      - SEALEDBOUNTY=${SEALEDBOUNTY}
      - OPERATOR_ALLOWLIST=${OPERATOR_ALLOWLIST}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock   # the dstack guest agent (a real TDX quote)
    restart: unless-stopped
